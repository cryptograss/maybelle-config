all:
  hosts:
    pickipedia:  # After picking, a picking encyclopedia
      ansible_host: 5.78.112.39
      ansible_user: root
      ansible_ssh_private_key_file: ~/.ssh/id_ed25519_hunter
  vars:
    # Server specs (Hetzner CX32 recommended)
    # - 4 vCPU (AMD EPYC)
    # - 8 GB RAM
    # - 80 GB NVMe
    # - ~€8/month

    # Domain and SSL
    domain_name: pickipedia.xyz
    www_domain: www.pickipedia.xyz
    admin_email: justin@cryptograss.live

    # Additional hostnames this wiki answers to, served directly rather than
    # redirected. Some networks run content filters that read the hostname out
    # of the TLS ClientHello and reset the connection on sight of
    # pickipedia.xyz, while leaving other names pointing at the very same
    # server alone; an alias is a door for readers stuck behind one of those.
    #
    # Each name here needs its own DNS A record pointing at this host before
    # Caddy can get a certificate for it — ACME will fail on any that don't
    # resolve here. The matching whitelist lives in the wiki's LocalSettings.php
    # ($pickipediaAltHosts), which is what makes MediaWiki emit links on the
    # alias instead of bouncing readers back to the canonical name.
    alias_domains:
      - pickipedia.cryptograss.live

    # XML sitemap output. Deliberately outside {{ mediawiki_root }}: Jenkins
    # rsyncs deploys over that tree and would sweep away anything generated
    # inside it.
    sitemap_dir: /var/www/pickipedia-sitemap

    # Combined podcast feed, served at https://{{ domain_name }}/{{ firehose_file }}.
    # Outside the MediaWiki tree for the same reason as the sitemap.
    #
    # The filename is a variable because two things have to agree on it — the
    # Caddy route and the script that writes the file — and a subscriber URL
    # that silently stops resolving is a bad way to find out they drifted.
    # Named for what it is: this wiki may well publish other feeds, and
    # "firehose.xml" at the site root would not say which one.
    firehose_dir: /var/www/pickipedia-firehose
    firehose_file: bluegrass-podcast-firehose.xml

    # How often to re-fetch the thirteen upstream podcast feeds. Every six
    # hours is well inside how often any of them publish, and keeps us to
    # ~50 requests a day per feed's host rather than being a nuisance.
    firehose_cron_hour: "*/6"

    # Hard ceiling on one firehose run, enforced by cron rather than by the
    # script, so it holds even when the script is the thing that is stuck.
    #
    # The tools have their own guards — a per-podcast budget for runaway
    # patterns, a size cap on responses, a socket timeout per fetch — and this
    # sits underneath all of them. Its job is not to catch the failure we
    # thought of; it is to make sure that whatever we did not think of costs one
    # run rather than a process that never exits and a second one every six
    # hours after that.
    #
    # Thirteen feeds at a 30s socket timeout is 390s worst case if every host
    # hangs, which has never happened; a real run takes about twenty seconds.
    firehose_timeout_seconds: 600

    # MediaWiki version
    mediawiki_version: "1.43.6"

    # Database
    mariadb_version: "10.11"
    db_name: pickipedia
    db_user: wiki

    # PHP version (MediaWiki 1.43 requires PHP 8.1+)
    php_version: "8.2"

    # Server paths
    web_root: /var/www/pickipedia
    mediawiki_root: /var/www/pickipedia

    # Backup sources (on maybelle)
    backup_host: maybelle.cryptograss.live
    backup_path: /mnt/persist/pickipedia/backups

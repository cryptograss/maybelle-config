all:
  hosts:
    pickipedia:  # After picking, a picking encyclopedia
      ansible_host: 5.78.112.39
      ansible_user: root
      ansible_ssh_private_key_file: ~/.ssh/id_ed25519_hunter
  vars:
    # Server specs (Hetzner CX32 recommended)
    # - 4 vCPU (AMD EPYC)
    # - 8 GB RAM
    # - 80 GB NVMe
    # - ~€8/month

    # Domain and SSL
    domain_name: pickipedia.xyz
    www_domain: www.pickipedia.xyz
    admin_email: justin@cryptograss.live

    # Additional hostnames this wiki answers to, served directly rather than
    # redirected. Some networks run content filters that read the hostname out
    # of the TLS ClientHello and reset the connection on sight of
    # pickipedia.xyz, while leaving other names pointing at the very same
    # server alone; an alias is a door for readers stuck behind one of those.
    #
    # Each name here needs its own DNS A record pointing at this host before
    # Caddy can get a certificate for it — ACME will fail on any that don't
    # resolve here. The matching whitelist lives in the wiki's LocalSettings.php
    # ($pickipediaAltHosts), which is what makes MediaWiki emit links on the
    # alias instead of bouncing readers back to the canonical name.
    alias_domains:
      - pickipedia.cryptograss.live

    # XML sitemap output. Deliberately outside {{ mediawiki_root }}: Jenkins
    # rsyncs deploys over that tree and would sweep away anything generated
    # inside it.
    sitemap_dir: /var/www/pickipedia-sitemap

    # MediaWiki version
    mediawiki_version: "1.43.6"

    # Database
    mariadb_version: "10.11"
    db_name: pickipedia
    db_user: wiki

    # PHP version (MediaWiki 1.43 requires PHP 8.1+)
    php_version: "8.2"

    # Server paths
    web_root: /var/www/pickipedia
    mediawiki_root: /var/www/pickipedia

    # Backup sources (on maybelle)
    backup_host: maybelle.cryptograss.live
    backup_path: /mnt/persist/pickipedia/backups

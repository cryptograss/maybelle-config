---
# PickiPedia VPS Provisioning Playbook
# MediaWiki wiki on dedicated Hetzner VPS
#
# Pre-requisites:
# 1. Create Hetzner CX32 VPS with Ubuntu 24.04
# 2. Add SSH key during creation
# 3. Point pickipedia.xyz A record to new server IP
# 4. Run: ansible-playbook -i inventory.yml playbook.yml
#
# Migration steps:
# 1. Run this playbook (creates empty MediaWiki)
# 2. Import database from backup
# 3. Import images from backup
# 4. Update LocalSettings.php with production secrets
# 5. Switch DNS to new server

- name: Provision PickiPedia MediaWiki Server
  hosts: pickipedia
  become: yes

  vars_files:
    - ../../secrets/vault.yml  # Relative to pickipedia-vps/ansible/

  vars:
    # Packages needed for MediaWiki
    system_packages:
      - apt-transport-https
      - ca-certificates
      - curl
      - software-properties-common
      - git
      - unzip
      - imagemagick
      - ffmpeg
      - lua5.4
      - liblua5.4-dev

  pre_tasks:
    # Caddy's Cloudsmith repository answers 402 (out of bandwidth since
    # 2026-10-09): left configured, this first apt update fails. The caddy
    # role installs from Caddy's GitHub releases instead.
    - name: Drop Caddy's Cloudsmith apt source
      file:
        path: /etc/apt/sources.list.d/caddy-stable.list
        state: absent

    # ondrej/php's PPA, left from the php-fpm role, which the playbook no longer runs (PHP is in the
    # wiki's container now). On 20 Nov 2026 the PPA relabelled itself "PPA for PHP (deprecated)", and apt
    # refuses a changed Label until it's accepted: every apt update failed. The first try used find's
    # `contains`, which matches from a line's start, so 'deb http://…/ondrej/php/…' never matched (deploy
    # log 26458169; the file was sources.list.d/ppa_ondrej_php_noble.list). grep -R searches anywhere in
    # a line, following links: a file in sources.list.d is removed, and a line in sources.list itself. Nothing installs from it; packages it gave stay until removed on purpose.
    - name: Find every apt source that names ondrej/php
      # sources.list only when it's there (Ubuntu 24.04 may have ubuntu.sources alone): grep exits 2
      # for a path that's missing, even when it matches elsewhere.
      shell: >-
        grep -RlE 'ondrej/php' /etc/apt/sources.list.d
        $([ -f /etc/apt/sources.list ] && echo /etc/apt/sources.list)
      register: ondrej_sources
      changed_when: false
      failed_when: ondrej_sources.rc > 1

    - name: Drop ondrej/php's lines from sources.list
      lineinfile:
        path: /etc/apt/sources.list
        regexp: 'ondrej/php'
        state: absent
      when: "'/etc/apt/sources.list' in ondrej_sources.stdout_lines"

    - name: Drop ondrej/php's files from sources.list.d
      file:
        path: "{{ item }}"
        state: absent
      loop: "{{ ondrej_sources.stdout_lines | reject('equalto', '/etc/apt/sources.list') | list }}"

    # cache_valid_time let the first try's update pass on an old cache, so the failure surfaced later, at
    # docker-wiki's install. Every update now runs, so a bad source stops the deploy here, by name.
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install system packages
      apt:
        name: "{{ system_packages }}"
        state: present

    - name: Set timezone
      timezone:
        name: UTC

    - name: Deploy SSH login banner
      copy:
        dest: /etc/motd
        mode: '0644'
        content: |
          =============================================
                      P I C K I P E D I A
          =============================================
          MediaWiki Encyclopedia for Traditional Music
          https://pickipedia.xyz
          =============================================

    - name: SSH by key only
      include_role:
        name: "{{ playbook_dir }}/../../shared/ansible/roles/ssh-keys-only"

    - name: Say in magenta who comes in by SSH, and as which account
      include_role:
        name: "{{ playbook_dir }}/../../shared/ansible/roles/ssh-announce"
      vars:
        ssh_announce_server: pickipedia

  roles:
    - mariadb
    - wiki-secrets       # LocalSettings.local.php, before anything connects to the database
    - docker-wiki        # Apache+PHP in Docker (replaces nginx + php-fpm)
    - caddy              # SSL termination, reverse proxy to container on :8080
    - role: goaccess     # Traffic dashboard at /stats/, from Caddy's access log (shared/ansible/roles); after caddy
      vars:
        goaccess_site: pickipedia
        goaccess_public_host: "{{ domain_name }}"
    - rabbithole-shell   # Static files served at /rabbithole/ same-origin with wiki
    - mediawiki

  post_tasks:
    - name: Display post-installation notes
      debug:
        msg: |
          PickiPedia VPS provisioned successfully!

          Next steps:
          1. Import database:
             scp maybelle:/mnt/persist/pickipedia/backups/pickipedia_latest.sql.gz /tmp/
             gunzip -c /tmp/pickipedia_*.sql.gz | mysql -u wiki -p pickipedia

          2. Import images:
             rsync -avz maybelle:/mnt/persist/pickipedia/backups/images/ {{ mediawiki_root }}/images/

          3. Update LocalSettings.php with production secrets

          4. Run MediaWiki update:
             cd {{ mediawiki_root }} && php maintenance/update.php

          5. Update DNS A record for pickipedia.xyz to point to this server

---
# MediaWiki configuration and secrets
# Code is deployed by Jenkins (rsync) and served by Docker container
# This role handles: directories, secrets, cron jobs

- name: Create web root directory
  file:
    path: "{{ mediawiki_root }}"
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'

- name: Create images directory
  file:
    path: "{{ mediawiki_root }}/images"
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'

- name: Create cache directory
  file:
    path: "{{ mediawiki_root }}/cache"
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'

# Outside {{ mediawiki_root }} on purpose. Jenkins rsyncs each deploy over that
# tree, so a sitemap generated inside it survives only until the next build.
- name: Create sitemap directory
  file:
    path: "{{ sitemap_dir }}"
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'

- name: Create podcast firehose directory
  file:
    path: "{{ firehose_dir }}"
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'

# NOTE: LocalSettings.php is deployed by Jenkins from the pickipedia repo.
# This ansible role handles secrets in LocalSettings.local.php.

- name: Fetch GlitchTip DSN from maybelle
  uri:
    url: "https://glitchtip-dsn.maybelle.cryptograss.live/pickipedia-dsn.txt"
    user: deploy
    password: "{{ glitchtip_dsn_fetch_password }}"
    force_basic_auth: true
    return_content: true
  register: glitchtip_dsn_response

- name: Create LocalSettings.local.php with secrets
  copy:
    dest: "{{ mediawiki_root }}/LocalSettings.local.php"
    content: |
      <?php
      # PickiPedia secrets - managed by ansible, NOT checked into version control

      # Database (connects via socket mounted into Docker container)
      $wgDBtype = "mysql";
      $wgDBserver = "localhost";
      $wgDBname = "{{ db_name }}";
      $wgDBuser = "{{ db_user }}";
      $wgDBpassword = "{{ pickipedia_db_password }}";

      # Security keys
      $wgSecretKey = "{{ pickipedia_secret_key }}";
      $wgUpgradeKey = "{{ pickipedia_upgrade_key }}";

      # Sentry/GlitchTip error tracking
      $wgSentryDsn = "{{ glitchtip_dsn_response.content | trim }}";

      # Delivery-kid pinning service API key
      $wgDeliveryKidApiKey = "{{ delivery_kid_api_key }}";
    owner: www-data
    group: www-data
    mode: '0600'

- name: Create job runner script (runs inside Docker container)
  copy:
    dest: /usr/local/bin/mediawiki-jobs.sh
    mode: '0755'
    content: |
      #!/bin/bash
      # Run MediaWiki job queue inside Docker container
      docker exec pickipedia-wiki php /var/www/html/maintenance/runJobs.php --maxjobs=50 --maxtime=60 2>&1 | logger -t mediawiki-jobs

- name: Schedule MediaWiki job runner
  ansible.builtin.cron:
    name: "mediawiki job queue"
    minute: "*/5"
    job: "/usr/local/bin/mediawiki-jobs.sh"

- name: Create sitemap generator script (runs inside Docker container)
  copy:
    dest: /usr/local/bin/mediawiki-sitemap.sh
    mode: '0755'
    content: |
      #!/bin/bash
      # Regenerate the XML sitemap so search engines can find all articles
      # without having to crawl their way to them link by link.
      #
      # --compress no: the corpus is small enough that gzip buys nothing, and
      # plain .xml avoids Caddy having to get Content-Encoding right on a
      # static file.
      # --skip-redirects: a redirect is not a page anyone should land on from
      # search results.
      # --identifier: fixes the index filename as sitemap-index-{{ db_name }}.xml,
      # which is what robots.txt in the pickipedia repo points at. Change one,
      # change the other.
      set -euo pipefail
      docker exec pickipedia-wiki php /var/www/html/maintenance/generateSitemap.php \
          --fspath /var/www/sitemap \
          --urlpath /sitemap/ \
          --server "https://{{ domain_name }}" \
          --identifier "{{ db_name }}" \
          --compress no \
          --skip-redirects 2>&1 | logger -t mediawiki-sitemap

- name: Schedule sitemap regeneration
  ansible.builtin.cron:
    name: "mediawiki sitemap"
    minute: "17"
    hour: "4"
    job: "/usr/local/bin/mediawiki-sitemap.sh"

- name: Create podcast firehose script
  copy:
    dest: /usr/local/bin/pickipedia-firehose.sh
    mode: '0755'
    content: |
      #!/bin/bash
      # Rebuild the combined bluegrass podcast feed served at
      # /{{ firehose_file }}.
      #
      # Runs on the host rather than in the wiki container: this is a plain
      # HTTP fetch of thirteen RSS feeds and needs nothing MediaWiki has.
      #
      # The script is deployed with the wiki tree by Jenkins — see the Copy
      # Tools stage in cryptograss/pickipedia's Jenkinsfile. If it is missing,
      # the wiki has not been deployed since that stage was added.
      set -euo pipefail

      SCRIPT="{{ mediawiki_root }}/tools/podcast-firehose.py"
      OUT="{{ firehose_dir }}/{{ firehose_file }}"

      if [ ! -f "$SCRIPT" ]; then
          echo "firehose: $SCRIPT not found; has the wiki been deployed?" >&2
          exit 1
      fi

      # Build to a temporary file and move it into place. An upstream feed that
      # hangs or dies partway would otherwise leave a truncated XML file being
      # served to every subscriber until the next run; this way the last good
      # feed keeps serving and only the log records the failure.
      TMP="$(mktemp)"
      trap 'rm -f "$TMP"' EXIT

      if python3 "$SCRIPT" "$TMP"; then
          mv "$TMP" "$OUT"
          trap - EXIT
          chown www-data:www-data "$OUT"
          chmod 0644 "$OUT"
          echo "firehose: rebuilt $OUT"
      else
          echo "firehose: generation failed, keeping the previous feed" >&2
          exit 1
      fi

- name: Schedule podcast firehose regeneration
  ansible.builtin.cron:
    name: "pickipedia podcast firehose"
    minute: "9"
    hour: "{{ firehose_cron_hour }}"
    job: >-
      timeout {{ firehose_timeout_seconds }} /usr/local/bin/pickipedia-firehose.sh
      2>&1 | logger -t pickipedia-firehose

- name: Set permissions on MediaWiki directories
  file:
    path: "{{ item }}"
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'
    recurse: yes
  loop:
    - "{{ mediawiki_root }}/images"
    - "{{ mediawiki_root }}/cache"

- name: Create migration import script
  copy:
    dest: /usr/local/bin/import-pickipedia-backup.sh
    mode: '0750'
    content: |
      #!/bin/bash
      # Import PickiPedia backup from maybelle
      set -euo pipefail

      BACKUP_HOST="{{ backup_host }}"
      BACKUP_PATH="{{ backup_path }}"
      MW_ROOT="{{ mediawiki_root }}"

      echo "=== PickiPedia Migration Import ==="
      echo ""

      # Find latest database backup
      echo "Fetching latest database backup from $BACKUP_HOST..."
      LATEST_DB=$(ssh root@$BACKUP_HOST "ls -t $BACKUP_PATH/pickipedia_*.sql.gz 2>/dev/null | head -1")

      if [ -z "$LATEST_DB" ]; then
          echo "ERROR: No database backup found on $BACKUP_HOST"
          exit 1
      fi

      echo "Found: $LATEST_DB"

      # Download and import database
      echo "Downloading database backup..."
      scp root@$BACKUP_HOST:$LATEST_DB /tmp/pickipedia-import.sql.gz

      echo "Importing database (this may take a while)..."
      gunzip -c /tmp/pickipedia-import.sql.gz | mysql {{ db_name }}

      echo "Database imported successfully."

      # Import images
      echo ""
      echo "Syncing images from $BACKUP_HOST..."
      rsync -avz --progress root@$BACKUP_HOST:$BACKUP_PATH/images/ $MW_ROOT/images/

      echo "Images synced."

      # Fix ownership
      chown -R www-data:www-data $MW_ROOT/images

      # Run MediaWiki update inside container
      echo ""
      echo "Running MediaWiki update script..."
      docker exec pickipedia-wiki php /var/www/html/maintenance/update.php --quick

      # Restart container to pick up changes
      docker restart pickipedia-wiki

      echo ""
      echo "=== Import Complete ==="
      echo ""
      echo "Test: curl -I https://{{ domain_name }}/wiki/Main_Page"

      # Cleanup
      rm -f /tmp/pickipedia-import.sql.gz

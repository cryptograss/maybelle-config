---
# Caddy for automatic SSL and reverse proxy
# Much simpler than certbot + nginx SSL config

- name: Install Caddy dependencies
  apt:
    name:
      - debian-keyring
      - debian-archive-keyring
      - apt-transport-https
    state: present

- name: Add Caddy GPG key
  apt_key:
    url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
    state: present

- name: Add Caddy repository
  apt_repository:
    repo: "deb https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main"
    state: present
    filename: caddy-stable

- name: Install Caddy
  apt:
    name: caddy
    state: present
    update_cache: yes

- name: Create Caddy log directory
  file:
    path: /var/log/caddy
    state: directory
    owner: caddy
    group: caddy
    mode: '0755'

- name: Create Caddyfile
  copy:
    dest: /etc/caddy/Caddyfile
    content: |
      # PickiPedia - SSL termination and reverse proxy
      #
      # alias_domains are served, not redirected. Bouncing them to
      # {{ domain_name }} would defeat their entire purpose: they exist for
      # readers on networks that block the canonical name outright.
      {{ domain_name }}, {{ www_domain }}{% for alias in alias_domains | default([]) %}, {{ alias }}{% endfor %} {
          # Static files for the Rabbithole shell. Served same-origin
          # with the wiki so the iframe right pane (loading
          # /wiki/Release:.../Metadata) shares cookies and can call
          # mw.Api directly.
          handle_path /rabbithole/* {
              root * /var/www/rabbithole
              try_files {path} {path}/ /shell.html
              file_server
          }

          # XML sitemap, regenerated on a cron by the mediawiki role. Served
          # straight off disk from outside the MediaWiki tree — Jenkins rsyncs
          # deploys over {{ mediawiki_root }}, so anything generated in there
          # gets swept away on the next build.
          handle_path /sitemap/* {
              root * {{ sitemap_dir }}
              file_server
          }

          # Combined podcast feed. A single file rather than a directory, so
          # `handle` and not `handle_path` — the request path is the filename
          # and stripping it would leave nothing to serve.
          handle /{{ firehose_file }} {
              root * {{ firehose_dir }}
              header Content-Type "application/rss+xml; charset=utf-8"
              file_server
          }

          # How the nightly podcast import went. Served so that the cron-health
          # job on maybelle can see it: cron output on this box goes to syslog,
          # and syslog on a VPS nobody logs into is where the firehose sat
          # broken for days with an error nobody read.
          handle_path /status/* {
              root * {{ status_dir }}
              header Content-Type "text/plain; charset=utf-8"
              file_server
          }

          handle {
              reverse_proxy 127.0.0.1:8080
          }

          # Security headers
          header {
              X-Content-Type-Options nosniff
              X-Frame-Options SAMEORIGIN
              Referrer-Policy strict-origin-when-cross-origin
              -Server
          }

          # Compression
          encode gzip zstd

          # Handle www redirect
          @www host {{ www_domain }}
          redir @www https://{{ domain_name }}{uri} permanent
      }

      # Health check endpoint (for monitoring from maybelle)
      :8081 {
          respond /health "OK" 200
      }
    mode: '0644'
  notify: Restart Caddy

- name: Start and enable Caddy
  systemd:
    name: caddy
    state: started
    enabled: yes
  register: caddy_start
  ignore_errors: yes

- name: Check Caddy status if start failed
  command: journalctl -u caddy --no-pager -n 20
  register: caddy_journal
  when: caddy_start.failed | default(false)

- name: Show Caddy error
  debug:
    var: caddy_journal.stdout_lines
  when: caddy_start.failed | default(false)

- name: Fail if Caddy didn't start
  fail:
    msg: "Caddy failed to start. Check the journal output above."
  when: caddy_start.failed | default(false)

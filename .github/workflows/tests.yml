# Run the delivery-kid test suite on every push and pull request.
#
# Until this existed, nothing ran these tests. Not GitHub, not either
# Jenkinsfile, and not the deploy — which rsyncs the service to the server
# with `--exclude=tests`. The suite had only ever been executed by a person
# choosing to type `pytest`.
#
# That is how four tests in test_coconut.py could assert a Coconut V1 output
# schema for months after the code moved to V2 without anyone noticing, and
# it is why "the tests pass" has been a claim rather than a checkable fact.
name: tests

on:
  push:
    paths:
      - '**/ansible/**'
      - 'shared/**'
      - 'scripts/**'
      - 'delivery-kid/pinning-service/**'
      - 'maybelle/scripts/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - '**/ansible/**'
      - 'shared/**'
      - 'scripts/**'
      - 'delivery-kid/pinning-service/**'
      - 'maybelle/scripts/**'
      - '.github/workflows/tests.yml'

jobs:
  pinning-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: delivery-kid/pinning-service

    steps:
      - uses: actions/checkout@v4

      # Matches the Dockerfile (python:3.12-slim) so a green run here means
      # something about the image that actually ships.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            delivery-kid/pinning-service/requirements.txt
            delivery-kid/pinning-service/requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: Run tests
        # The whole suite runs. The four permanently-red Coconut tests that
        # used to be excluded here went with the code they tested (#121).
        run: pytest -v

  # The storage audit decides what the wiki tells us to delete, so being
  # wrong there costs records rather than a red build. Its tests arrived
  # with #145 and nothing ran them: this workflow only watched
  # delivery-kid/pinning-service, which is the same gap the comment at the
  # top of this file was written about.
  maybelle-scripts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # These scripts have no requirements file — they run on maybelle
      # against the system Python. Named explicitly rather than pinned so a
      # missing import shows up here instead of on the server.
      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest PyYAML mwclient

      - name: Run tests
        run: pytest -v maybelle/scripts/tests

  # recovery-gate decides what Pi may do on hunter's host as the `recovery`
  # user: deny the calls that crashed dockerd, anything that deletes
  # containers or reboots, ask Justin for everything else. It is the only
  # thing between a root-equivalent session and `reboot`, so being wrong
  # there is worse than a red build. Its tests existed from the start and
  # nothing ran them — not GitHub, either Jenkinsfile, nor the deploy, which
  # copies recovery-gate.ts to hunter and left the test behind. See #234.
  recovery-gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # jiti, not node --experimental-strip-types: node's type stripping
      # depends on the build, not the version (22.22.1 here has none; jiti is
      # how Pi loads this file too). The file itself registers its tests with
      # node:test, so this runs the whole suite.
      - name: Run tests
        run: npx --yes jiti@2 hunter/ansible/roles/recovery/test_recovery_gate.mjs

  # What a change to the deploy logic renders differently from production,
  # in the run's summary (scripts/render_diff.py): every template and every
  # Jinja string the servers' playbooks reach, found by walking them, with
  # no vault and nothing executed. Red only when something that rendered
  # before fails to render now; an intended change is for the PR to explain,
  # so a diff alone never fails it.
  render-diff:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest PyYAML ansible-core

      - name: Its own tests
        run: pytest -v scripts/tests

      - name: Render against the base branch
        if: github.event_name == 'pull_request'
        run: |
          set -o pipefail
          { echo '```diff'; status=0; python scripts/render_diff.py --base "origin/${{ github.base_ref }}" || status=$?; echo '```'; exit $status; } | tee -a "$GITHUB_STEP_SUMMARY"

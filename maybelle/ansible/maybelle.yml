---
- name: Provision Jenkins for Cryptograss
  hosts: all
  connection: local

  vars_files:
    - ../../secrets/vault.yml

  vars:
    jenkins_port: 8080
    docker_users:
      - jenkins
    node_version: "23.6.1"
    domain_name: "maybelle.cryptograss.live"
    github_repo_url: "https://github.com/cryptograss/justinholmes.com" # TODO: make this dynamic?  Certainly it will change with the repo rename.
    jenkins_home: "/var/jenkins_home"
    caddy_config_type: "maybelle"  # Use maybelle-specific Caddyfile template
    # githouse, our canonical copies of the repositories (shared/ansible/roles/githouse;
    # Cryptograss:Moods/ramp/Plan, section 3). Reached by hunter's containers on the
    # private network, and by people on the public address too (githouse_public, below).
    githouse_dir: /mnt/persist/githouse
    githouse_bind: "10.0.0.2"
    githouse_port: 2222
    # On maybelle's public address too, so people push from their own machines without a jump host (Justin,
    # #ramp, 11 Nov): ssh://git@maybelle.cryptograss.live:2222/<repo>.git. The role says what that exposes.
    githouse_public: true
    githouse_repos: "{{ lookup('file', playbook_dir + '/../../shared/githouse/repos.txt').splitlines() | select('match', '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') | list }}"
    # Who may push, and as whom: each hunter container (hunter/ansible/inventory.yml
    # users[].name) and the names its relayed keys may vouch for. The trust anchor:
    # a key hunter relays under any other name is ignored. hunter's own mirror
    # key fetches only.
    githouse_pushers:
      emergent-magent: [magent]
      emergent-re: [re]
      emergent-blu: [blu]
      hunter: {names: [mirror], fetch_only: true}
    # People who push their own branches (<name>/*) from their own machines, by the key hunter's inventory knows
    # them by, through maybelle as a jump host (Justin, #ramp, 11 Nov: "add the githouse remote to my local repos").
    # Merging stays a signed order. GitHub as a dumb mirror needs everyone who writes code to come in here.
    githouse_people: [justin]
    # Who may merge a branch without a pull request: `magenta.sh merge <repo>:<branch>`,
    # signed with their SSH key and checked by githouse (Plan, section 8). Justin added
    # skyler on 7 Nov (#ramp, #m-39e5f25f).
    githouse_mergers: [justin, skyler]
    # Asked at every merge order whether AZ5 is on or the signer is banned (Plan, section 10):
    # memory-lane on the private network, as hunter reaches it.
    githouse_brakes_url: "http://10.0.0.2:3000/api/brakes/"
    # Where merge orders wait to be fetched: memory-lane carries them, githouse checks each.
    githouse_orders_url: "http://10.0.0.2:3000/api/merge-orders/pending/"
    # After a push reaches GitHub, githouse asks Jenkins' branch-tests job to test it, as the reporter (Plan,
    # section 11). Jenkins publishes 8080 on the host, which githouse reaches as hunter does.
    githouse_jenkins_url: "http://10.0.0.2:8080/"
    # memory-lane's merge key, public half: the merge button signs with it, for whoever pressed (Plan, section
    # 10). Made by Justin on 8 Nov, the private half in the vault as memory_lane_merge_key. githouse lists it as
    # a signer, and merges a press only for a person in githouse_mergers, braked or not as that person.
    githouse_device_signer_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEZ0e+DFH+grTrRBkYlzIsAnnZ369/li+OWBVBimZiPj memory-lane-merge"

  pre_tasks:
    - name: Install community.docker collection
      command: ansible-galaxy collection install community.docker
      changed_when: false

  tasks:
    # Note: maybelle-config repo is managed by the chapter scripts on the persistent volume
    # No need to clone it here - we're already running from it

    # Grow the filesystem to fill the Hetzner volume. Resizing the volume in Hetzner's
    # console grows the block device only; this makes the extra space usable, online, at
    # the next deploy, so nobody runs resize2fs by hand. A no-op when it already fills it.
    - name: Find the persistent volume's filesystem
      command: findmnt -n -o SOURCE,FSTYPE --target /mnt/HC_Volume_104062902
      register: persist_fs
      changed_when: false

    - name: Grow the persistent volume's filesystem to the volume's size
      command: resize2fs {{ persist_fs.stdout.split()[0] }}
      register: persist_grow
      changed_when: "'Nothing to do' not in persist_grow.stderr"
      when: persist_fs.stdout.split() | length == 2 and persist_fs.stdout.split()[1] in ['ext4', 'ext3']

    - name: SSH by key only
      include_role:
        name: ssh-keys-only

    - name: Say in magenta who comes in by SSH, and as which account
      include_role:
        name: ssh-announce
      vars:
        ssh_announce_server: maybelle

    - name: The recovery log, written to from recovery@hunter and only appended to
      include_role:
        name: recovery-log
      vars:
        # Read as maybelle.yml reads the people (lookup, not include_vars: see below).
        recovery_log_public_key: "{{ (lookup('file', playbook_dir ~ '/../../hunter/ansible/inventory.yml') | from_yaml).all.vars.recovery_log_public_key | default('') }}"

    - name: Deploy maybelle SSH login banner
      copy:
        src: "{{ playbook_dir }}/../../ascii-art/maybelle-ascii-dark.txt"
        dest: /etc/motd
        mode: '0644'

    - name: Install required packages
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
          - docker.io
          - docker-compose-v2
          - docker-buildx
          - ansible
          - jq
          # Needed by the delivery-kid audit cron's python3 -m venv call
          - python3-venv
        state: present
        update_cache: yes

    - name: Create Jenkins home directory
      file:
        path: "{{ jenkins_home }}"
        state: directory
        mode: '0755'
        owner: 1000  # jenkins user in container
        group: 1000  # jenkins group in container

    - name: Copy environment file
      copy:
        content: "{{ maybelle_env }}"
        dest: "{{ jenkins_home }}/.env"
        mode: '0600'
        owner: 1000
        group: 1000

    - name: Create Jenkins Docker build directory
      file:
        path: "{{ jenkins_home }}/docker-build"
        state: directory
        mode: '0755'

    - name: Copy Dockerfile and build context
      copy:
        src: "{{ playbook_dir }}/../jenkins-docker/"
        dest: "{{ jenkins_home }}/docker-build/"
        mode: '0644'

    - name: Create blank .bashrc
      file:
        path: "{{ jenkins_home }}/.bashrc"
        state: touch
        mode: '0644'
        owner: 1000
        group: 1000

    - name: Build Jenkins Docker image
      docker_image:
        name: cryptograss-jenkins
        build:
          path: "{{ jenkins_home }}/docker-build"
          pull: yes
        source: build
        force_source: yes

    - name: Create Jenkins Casc Configs directory
      file:
        path: "{{ jenkins_home }}/casc_configs"
        state: directory
        mode: '0755'
        owner: 1000
        group: 1000

    - name: Create Jenkins Docker network
      docker_network:
        name: jenkins-network
        state: present

    # Where branch code runs (Plan, section 11): internal, so no route out, and its bridge has no address on
    # the host (inhibit_ipv4), so the host's own services (sshd, Docker's published ports) aren't reachable
    # through it either. Checked on a preview on hunter, 9 Nov: with inhibit_ipv4, the gateway address answers
    # nothing and 10.0.0.2, 10.0.0.4 and 169.254.169.254 have no route; without it, the host's sshd answered.
    # Its members: the agent, its proxy, and Jenkins, which the agent dials.
    - name: branches-net, where branch code runs
      docker_network:
        name: branches-net
        internal: true
        enable_ipv6: false          # said, not assumed: inhibit_ipv4 only takes the IPv4 address away (re)
        driver_options:
          com.docker.network.bridge.inhibit_ipv4: "true"
        ipam_config:
          - subnet: 172.31.250.0/24

    - name: Copy Jenkins configuration file
      copy:
        src: "{{ playbook_dir }}/../configs/jenkins.yml"
        dest: "{{ jenkins_home }}/casc_configs/jenkins.yml"
        mode: '0644'
        owner: 1000
        group: 1000
      notify: Restart Jenkins container

    # Job .groovy files MUST be copied before the container starts. JCasC's
    # `jobs:` list references each .groovy by absolute path; if any file is
    # missing when Jenkins boots, JCasC throws NoSuchFileException and
    # Jenkins enters a crash loop. Earlier tasks like `docker exec jenkins
    # ...` then fail and the playbook bails before reaching the jobs copy
    # at the end — chicken-and-egg deadlock that requires manual recovery.
    - name: Create Jenkins jobs directory
      file:
        path: "{{ jenkins_home }}/jobs"
        state: directory
        mode: '0755'
        owner: 1000
        group: 1000

    # cron-health tells #ops when a check turns red or green (report-alarm.sh).
    - name: Create Jenkins bin directory
      file:
        path: "{{ jenkins_home }}/bin"
        state: directory
        mode: '0755'
        owner: 1000
        group: 1000

    - name: Copy the Configuration as Code reload for the deploy
      copy:
        src: "{{ playbook_dir }}/../scripts/jcasc-reload.sh"
        dest: "{{ jenkins_home }}/bin/jcasc-reload.sh"
        mode: '0755'
        owner: 1000
        group: 1000

    - name: Copy the alarm reporter for Jenkins jobs
      copy:
        src: "{{ playbook_dir }}/../scripts/report-alarm.sh"
        dest: "{{ jenkins_home }}/bin/report-alarm.sh"
        mode: '0755'
        owner: 1000
        group: 1000

    - name: Copy Jenkins job definitions
      copy:
        src: "{{ playbook_dir }}/../jobs/"
        dest: "{{ jenkins_home }}/jobs/"
        mode: '0644'
        owner: 1000
        group: 1000
      notify: Restart Jenkins container

    # Health-check scripts have to live inside the container. Only
    # jenkins_home and a few log files are mounted — the maybelle-config
    # checkout on the host is not — so a job pointing at
    # /mnt/persist/maybelle-config/... resolves to nothing and the step dies
    # with "not found". Copying them here mirrors how job .groovy files are
    # already handled, and avoids mounting the whole config repo (vault
    # included) into Jenkins just to reach two files.
    - name: Create Jenkins scripts directory
      file:
        path: "{{ jenkins_home }}/scripts"
        state: directory
        mode: '0755'
        owner: 1000
        group: 1000

    - name: Copy health-check scripts into Jenkins
      copy:
        src: "{{ item }}"
        dest: "{{ jenkins_home }}/scripts/"
        mode: '0755'
        owner: 1000
        group: 1000
      loop:
        - "{{ playbook_dir }}/../scripts/test-magenta-memory.py"
        - "{{ playbook_dir }}/../../delivery-kid/scripts/test-delivery-kid.py"

    # `copy` doesn't delete files at dest that aren't in src, so removing a
    # .groovy from jobs/ leaves the old definition lingering. This task
    # ensures retired .groovy files don't get re-loaded on restart.
    - name: Remove retired Jenkins job-DSL files
      file:
        path: "{{ jenkins_home }}/jobs/{{ item }}"
        state: absent
      loop:
        - arthel-rsync-status.groovy
        - pickipedia-rsync-status.groovy
        - backup-pickipedia.groovy
        - backup-memory-lane.groovy
        - pickipedia-enrich-torrents.groovy
        # 10 Nov: it ran any arthel branch's own integration/Jenkinsfile on the controller, with every secret
        # there, emergents' branches included (githouse forwards them to GitHub); every build had failed since
        # July. Branch code runs on the branches agent only (Plan, section 11).
        - arthel-branches-builds.groovy
      notify: Restart Jenkins container

    # Jenkins persists job runtime state (config.xml, builds/) in
    # $JENKINS_HOME/jobs/<name>/, and its own startup scan loads any
    # directory found there — independently of JCasC. So removing a
    # .groovy alone doesn't make the job disappear from the UI; the
    # runtime dir has to go too. Lose the build history, but that was
    # the goal: these jobs are retired.
    - name: Remove retired Jenkins job runtime directories
      file:
        path: "{{ jenkins_home }}/jobs/{{ item }}"
        state: absent
      loop:
        - arthel-rsync-status
        - pickipedia-rsync-status
        - backup-pickipedia
        - backup-memory-lane
        - pickipedia-enrich-torrents
        - arthel-branches-builds
      notify: Restart Jenkins container

    - name: Check if log paths are directories (Docker creates dirs for missing mount sources)
      stat:
        path: "{{ item }}"
      register: log_stats
      loop:
        - /var/log/nfs-backup.log
        - /var/log/nfs-deploy.log
        - /var/log/pickipedia-backup.log
        - /var/log/pickipedia-deploy.log

    - name: Remove log paths if they are directories
      file:
        path: "{{ item.stat.path }}"
        state: absent
      loop: "{{ log_stats.results }}"
      when: item.stat.exists and item.stat.isdir

    - name: Create log files for Jenkins to read
      file:
        path: "{{ item }}"
        state: touch
        mode: '0644'
      loop:
        - /var/log/nfs-backup.log
        - /var/log/nfs-deploy.log
        - /var/log/pickipedia-backup.log
        - /var/log/pickipedia-deploy.log

    # Jenkins' git trusts githouse's repositories: a system config file, mounted read-only at /etc/gitconfig
    # (the image has none). githouse's git user owns /srv/git, and git won't read another user's repository
    # unless told to; neither -c nor the environment reaches a local fetch's upload-pack (tried 10 Nov). Not
    # `git config --global` in jenkins_home by docker exec: the 10 Nov deploy failed there on a stale
    # .gitconfig.lock ("could not lock config file"), and this file needs no lock and says its state.
    - name: Where Jenkins' git config lives
      file:
        path: /mnt/persist/jenkins-etc
        state: directory
        mode: '0755'

    - name: Jenkins' git config, trusting githouse's repositories
      copy:
        dest: /mnt/persist/jenkins-etc/gitconfig
        mode: '0644'
        content: |
          # Written by maybelle.yml: the trusted jobs build from githouse (Cryptograss:Moods/ramp/Plan, section 7).
          [safe]
          {% for full_name in githouse_repos %}
              directory = /srv/git/{{ full_name.split('/')[1] }}.git
          {% endfor %}
      register: jenkins_gitconfig

    - name: Start Jenkins container
      docker_container:
        name: jenkins
        image: cryptograss-jenkins:latest
        restart_policy: unless-stopped
        # A file mounted by itself keeps the inode it was started with, and copy replaces by rename: a changed
        # gitconfig (a repository added to githouse) reaches Jenkins only by a restart.
        restart: "{{ jenkins_gitconfig is changed }}"
        volumes:
          - "{{ jenkins_home }}:/var/jenkins_home"
          - "/mnt/persist/magenta/backups:/mnt/persist/magenta/backups:ro"
          - "/mnt/persist/pickipedia/backups:/mnt/persist/pickipedia/backups:ro"
          - "/mnt/persist/blue-railroad-cache:/mnt/persist/blue-railroad-cache"
          - "/var/log/nfs-backup.log:/var/log/nfs-backup.log:ro"
          - "/var/log/nfs-deploy.log:/var/log/nfs-deploy.log:ro"
          - "/var/log/pickipedia-backup.log:/var/log/pickipedia-backup.log:ro"
          - "/var/log/pickipedia-deploy.log:/var/log/pickipedia-deploy.log:ro"
          - "/var/log/delivery-kid-audit.log:/var/log/delivery-kid-audit.log:ro"
          # githouse's repositories, read-only: the trusted jobs (pickipedia, arthel) build from them, not from
          # GitHub (the flip, Cryptograss:Moods/ramp/Plan, section 6). memory-lane mounts them the same way.
          - "{{ githouse_dir }}/git:/srv/git:ro"
          - "/mnt/persist/jenkins-etc/gitconfig:/etc/gitconfig:ro"
          # Docker socket removed - Jenkins doesn't need it and it's a security risk
        etc_hosts:
          # Use Hetzner private network for faster/reliable inter-VPS communication
          pickipedia.xyz: "10.0.0.4"
        env_file: "{{ jenkins_home }}/.env"
        env:
          # The image's JAVA_OPTS, and local checkouts allowed: the git plugin refuses file:// since SECURITY-2478,
          # so a job's config can't read the controller's disk. Ours are written here, and /srv/git is githouse's.
          JAVA_OPTS: "-Djenkins.install.runSetupWizard=false -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true"
          CASC_JENKINS_CONFIG: "/var/jenkins_home/casc_configs/jenkins.yml"
          JENKINS_ADMIN_ID: admin
          JENKINS_ADMIN_PASSWORD: "{{ jenkins_admin_password }}"
          JENKINS_REPORTER_PASSWORD: "{{ jenkins_reporter_password }}"
          GITHUB_REPO_URL: "{{ github_repo_url }}"
          BLUERAILROAD_BOT_USERNAME: "{{ BLUERAILROAD_BOT_USERNAME }}"
          BLUERAILROAD_BOT_PASSWORD: "{{ BLUERAILROAD_BOT_PASSWORD }}"
          DELIVERY_KID_API_KEY: "{{ delivery_kid_api_key }}"
          # report-alarm.sh posts a red or green check to #ops with this; it can do nothing else.
          MOOD_ALARM_KEY: "{{ memory_lane_alarm_key | default('') }}"
        ports:
          - "8080:8080"
        networks:
          - name: jenkins-network
          - name: branches-net

    # Apply any pending Jenkins-restart handlers right now, before the
    # docker-exec tasks below. If JCasC config or job .groovy files
    # changed earlier in the play, the container needs to restart cleanly
    # to pick them up.
    - name: Apply pending Jenkins restart before docker-exec tasks
      meta: flush_handlers

    # If the container is currently in a crash loop from a previous bad
    # deploy, no notify is pending (the file changes are idempotent on
    # re-run), so flush_handlers above is a no-op. Inspect Jenkins's state
    # and force a clean restart only when it's not already stably running —
    # that breaks the restart-policy backoff and lets the new files take.
    - name: Inspect Jenkins container state
      command: docker inspect -f '{{ "{{" }}.State.Status{{ "}}" }}' jenkins
      register: jenkins_state
      changed_when: false

    - name: Force-restart Jenkins if not running cleanly
      command: docker restart jenkins   # the container that's there, as the handler does (11 Nov)
      when: jenkins_state.stdout != "running"

    # Wait until docker exec actually works — being briefly in "running"
    # state during a crash-loop flash doesn't mean exec will succeed.
    - name: Wait for Jenkins container to accept docker exec
      command: docker exec jenkins true
      register: jenkins_exec_ready
      until: jenkins_exec_ready.rc == 0
      retries: 30
      delay: 2
      changed_when: false

    # A job new to this deploy can be written to disk at boot and still not be loaded until the next start
    # (branch-tests, 9 Nov: JCasC made it 65 ms before "Loaded all jobs", from a list read without it).
    # Reloading Configuration as Code once Jenkins is up creates it now; then every job the config names is
    # checked to exist, and the deploy fails if one doesn't (scripts/jcasc-reload.sh).
    - name: Configuration as Code reloaded, and every job it names there
      command: docker exec jenkins sh /var/jenkins_home/bin/jcasc-reload.sh
      register: jcasc_reload
      changed_when: false

    # --- The branches agent (Cryptograss:Moods/ramp/Plan, section 11) ------------------------------------
    # Branch code runs here and nowhere else: jobs/branch-tests.groovy, a fixed pipeline, runs a branch's own
    # ci/test inside `sh` on this agent. No secrets, no jenkins_home; on branches-net, which reaches Jenkins and
    # the proxy, and the proxy lets through only the package registries and GitHub (jenkins-branches/proxy).
    - name: The branches agent's build contexts
      copy:
        src: "{{ playbook_dir }}/../jenkins-branches/"
        dest: /mnt/persist/jenkins-branches/build/
        mode: '0644'

    - name: The branches agent's image
      docker_image:
        name: cryptograss-jenkins-branches
        build:
          path: /mnt/persist/jenkins-branches/build
          pull: yes
        source: build
        force_source: yes

    - name: The branches proxy's image
      docker_image:
        name: cryptograss-branches-proxy
        build:
          path: /mnt/persist/jenkins-branches/build/proxy
          pull: yes
        source: build
        force_source: yes

    - name: The branches proxy, the agent's only way out
      docker_container:
        name: branches-proxy
        image: cryptograss-branches-proxy
        restart_policy: unless-stopped
        recreate: true
        networks:
          - name: bridge
          - name: branches-net
        memory: 128m

    # Jenkins derives an inbound agent's secret from its name; asked as admin, inside the Jenkins container,
    # so the password never leaves it. Written where only the agent's user reads it.
    - name: The branches agent's secret, from Jenkins
      shell: |
        set -o pipefail
        docker exec jenkins sh -c 'curl -sf -u "$JENKINS_ADMIN_ID:$JENKINS_ADMIN_PASSWORD" http://localhost:8080/computer/branches/jenkins-agent.jnlp' \
          | python3 -c 'import re, sys; m = re.search(r"<argument>([0-9a-f]{64})</argument>", sys.stdin.read()); print(m.group(1)) if m else sys.exit(1)' \
          > /mnt/persist/jenkins-branches/agent-secret.new
        install -m 0400 -o 1000 -g 1000 /mnt/persist/jenkins-branches/agent-secret.new /mnt/persist/jenkins-branches/agent-secret
        rm -f /mnt/persist/jenkins-branches/agent-secret.new
      args:
        executable: /bin/bash
      register: branches_secret
      until: branches_secret.rc == 0
      retries: 30
      delay: 5
      changed_when: false
      no_log: true

    - name: The branches agent
      docker_container:
        name: jenkins-branches
        image: cryptograss-jenkins-branches
        restart_policy: unless-stopped
        recreate: true
        networks:
          - name: branches-net
        env:
          JENKINS_URL: "http://jenkins:8080/"
          JENKINS_AGENT_NAME: "branches"
          JENKINS_SECRET: "@/run/agent-secret"
          JENKINS_WEB_SOCKET: "true"
          HTTP_PROXY: "http://branches-proxy:8888"
          HTTPS_PROXY: "http://branches-proxy:8888"
          http_proxy: "http://branches-proxy:8888"
          https_proxy: "http://branches-proxy:8888"
          NO_PROXY: "jenkins,localhost,127.0.0.1"
          no_proxy: "jenkins,localhost,127.0.0.1"
        volumes:
          - /mnt/persist/jenkins-branches/agent-secret:/run/agent-secret:ro
        memory: 4g
        cpus: 2
        pids_limit: 2048
        # An init as PID 1 (docker's tini), with the agent under it. The agent's java was PID 1 and reaps
        # nothing: every git or sh orphaned by a build stayed <defunct>, holding its slot, until all 2048 were
        # held and no build could fork (9 Nov: #19-#21 failed on "Resource temporarily unavailable").
        init: true

    # The line the design rests on, checked from inside, every deploy: nothing of ours answers the agent but
    # Jenkins and its proxy, and the proxy won't carry it anywhere but the registries and GitHub.
    - name: The branches agent reaches nothing of ours
      shell: docker exec -i jenkins-branches python3 - < /mnt/persist/jenkins-branches/build/isolation_check.py
      changed_when: false

    - name: Clone or update blue-railroad-import source
      command: >
        docker exec -u root jenkins bash -c '
          git config --global --add safe.directory /opt/blue-railroad-import-src 2>/dev/null;
          if [ -d /opt/blue-railroad-import-src/.git ]; then
            cd /opt/blue-railroad-import-src && git fetch origin && git reset --hard origin/production
          else
            git clone --branch production https://github.com/cryptograss/blue-railroad-import.git /opt/blue-railroad-import-src
          fi
        '

    - name: Install blue-railroad-import from local checkout
      command: docker exec -u root jenkins /opt/blue-railroad-import/bin/pip install --no-cache-dir --no-deps --force-reinstall /opt/blue-railroad-import-src

    - name: Fix blue-railroad-cache permissions
      command: docker exec -u root jenkins chown -R jenkins:jenkins /mnt/persist/blue-railroad-cache
      failed_when: false

    - name: Hash GlitchTip DSN fetch password for Caddy basicauth
      command: docker run --rm caddy caddy hash-password --plaintext '{{ glitchtip_dsn_fetch_password }}'
      register: glitchtip_dsn_password_hash_result
      changed_when: false
      no_log: true

    - name: Set GlitchTip DSN fetch password hash variable
      set_fact:
        glitchtip_dsn_fetch_password_hashed: "{{ glitchtip_dsn_password_hash_result.stdout }}"
      no_log: true

    - name: Configure Caddy reverse proxy
      include_role:
        name: caddy

    - name: Create .ssh directory for root
      file:
        path: "/root/.ssh"
        state: directory
        mode: '0700'
        owner: root
        group: root

    - name: Deploy NFS SSH key from vault
      copy:
        content: "{{ nfs_ssh_key | b64decode }}"
        dest: "/root/.ssh/id_ed25519_nfs"
        mode: '0600'
        owner: root
        group: root

    - name: Deploy Jenkins reporter password for deploy scripts
      copy:
        content: "{{ jenkins_reporter_password }}"
        dest: "/root/.jenkins_reporter_password"
        mode: '0600'
        owner: root
        group: root

    # The deploy scripts tell the Moods when a server is redeployed
    # (scripts/report-deploy.sh); memory-lane checks the same key.
    - name: Deploy memory-lane deploy key for the deploy scripts
      copy:
        content: "{{ memory_lane_deploy_key }}"
        dest: "/root/.memory_lane_deploy_key"
        mode: '0600'
        owner: root
        group: root
      when: memory_lane_deploy_key is defined

    - name: Create .ssh directory for jenkins user
      file:
        path: "{{ jenkins_home }}/.ssh"
        state: directory
        mode: '0700'
        owner: 1000
        group: 1000

    - name: Generate backup SSH key for hunter access
      openssh_keypair:
        path: "/var/jenkins_home/.ssh/id_ed25519_backup"
        type: ed25519
        owner: 1000
        group: 1000
        state: present
        comment: "maybelle-backup@hunter"

    - name: Deploy Jenkins GitHub SSH key from vault
      copy:
        content: "{{ jenkins_github_ssh_key | b64decode }}"
        dest: "/var/jenkins_home/.ssh/id_ed25519"
        mode: '0600'
        owner: 1000
        group: 1000

    - name: Deploy hunter root SSH key from vault
      copy:
        content: "{{ hunter_root_ssh_key | b64decode }}"
        dest: "/root/.ssh/id_ed25519_hunter"
        mode: '0600'
        owner: root
        group: root

    - name: Configure SSH for hunter, NFS, and delivery-kid
      copy:
        dest: "/root/.ssh/config"
        content: |
          Host hunter.cryptograss.live
            IdentityFile ~/.ssh/id_ed25519_hunter
            User root

          Host ssh.nyc1.nearlyfreespeech.net
            IdentityFile ~/.ssh/id_ed25519_nfs
            User jmyles_justinholmescom

          # delivery-kid reuses the hunter key (see delivery-kid/ansible/inventory.yml).
          # Needed by the host cron `run-delivery-kid-audit.sh`, which calls
          # audit-storage.py — that script SSHes to delivery-kid to list IPFS
          # pins, seeding dirs, and staging drafts.
          Host delivery-kid.cryptograss.live
            IdentityFile ~/.ssh/id_ed25519_hunter
            User root
        mode: '0600'
        owner: root
        group: root

    - name: Add hunter to known_hosts
      ansible.builtin.shell:
        cmd: "ssh-keyscan -H hunter.cryptograss.live >> /root/.ssh/known_hosts"

    - name: Add delivery-kid to root known_hosts
      ansible.builtin.shell:
        cmd: "ssh-keyscan -H delivery-kid.cryptograss.live >> /root/.ssh/known_hosts"
      changed_when: false

    - name: Ensure that known_hosts is present
      ansible.builtin.file:
        path: "~/.ssh/known_hosts"
        state: touch

    - name: Remove stale NFS host key from root known_hosts
      ansible.builtin.shell:
        cmd: "ssh-keygen -f /root/.ssh/known_hosts -R ssh.nyc1.nearlyfreespeech.net 2>/dev/null || true"

    - name: Add current NFS host key to root known_hosts
      ansible.builtin.shell:
        cmd: "ssh-keyscan -H ssh.nyc1.nearlyfreespeech.net >> /root/.ssh/known_hosts 2>/dev/null"
    - name: Add known_hosts entry for github.com
      ansible.builtin.shell:
        cmd: "ssh-keyscan -H github.com >> /var/jenkins_home/.ssh/known_hosts"

    - name: Add hunter to jenkins user known_hosts
      ansible.builtin.shell:
        cmd: "ssh-keyscan -H hunter.cryptograss.live >> /var/jenkins_home/.ssh/known_hosts"

    - name: Fix ownership of jenkins known_hosts
      file:
        path: /var/jenkins_home/.ssh/known_hosts
        owner: 1000
        group: 1000
        mode: '0644'

    - name: Create production deploy script
      copy:
        dest: /usr/local/bin/deploy-to-nfs.sh
        mode: '0750'
        content: |
          #!/bin/bash
          # Deploy production builds to NearlyFreeSpeech
          # Only deploys if Jenkins has marked a successful build

          MARKER_FILE="/var/jenkins_home/www/builds/production/.deploy-ready"
          BUILD_DIR="/var/jenkins_home/www/builds/production"
          LOG_FILE="/var/log/nfs-deploy.log"
          SSH_KEY="/root/.ssh/id_ed25519_nfs"
          NFS_TARGET="jmyles_justinholmescom@ssh.nyc1.nearlyfreespeech.net:"

          # Check if marker exists
          if [ ! -f "$MARKER_FILE" ]; then
              exit 0  # No deploy needed, exit silently
          fi

          # Get build info from marker
          BUILD_INFO=$(cat "$MARKER_FILE")

          echo "$(date): Starting deploy - $BUILD_INFO" >> "$LOG_FILE"

          # Perform the rsync
          if rsync -vah --delete \
              -e "ssh -i $SSH_KEY -o StrictHostKeyChecking=no" \
              "$BUILD_DIR"/* \
              "$NFS_TARGET" >> "$LOG_FILE" 2>&1; then

              # Success - remove marker and log
              rm -f "$MARKER_FILE"
              echo "$(date): Deploy successful" >> "$LOG_FILE"
          else
              echo "$(date): Deploy FAILED" >> "$LOG_FILE"
              exit 1
          fi

    - name: Cronjob to deploy production builds to NFS
      ansible.builtin.cron:
        name: "deploy to nfs"
        job: "/usr/local/bin/deploy-to-nfs.sh"
        minute: "*/2"

    - name: Create PickiPedia production deploy script
      copy:
        dest: /usr/local/bin/deploy-pickipedia-to-vps.sh
        mode: '0750'
        content: |
          #!/bin/bash
          # Deploy PickiPedia production builds to VPS
          # Only deploys if Jenkins has marked a successful build

          MARKER_FILE="/var/jenkins_home/pickipedia_stage/.deploy-ready"
          PAUSE_FILE="/var/jenkins_home/.pickipedia-deploy-paused"
          BUILD_DIR="/var/jenkins_home/pickipedia_stage"
          LOG_FILE="/var/log/pickipedia-deploy.log"
          SSH_KEY="/root/.ssh/id_ed25519_hunter"
          VPS_HOST="5.78.112.39"
          VPS_TARGET="root@${VPS_HOST}:/var/www/pickipedia/"

          # Check if deploys are paused
          if [ -f "$PAUSE_FILE" ]; then
              echo "$(date): Deploy paused - $(cat "$PAUSE_FILE")" >> "$LOG_FILE"
              exit 0
          fi

          # Check if marker exists
          if [ ! -f "$MARKER_FILE" ]; then
              exit 0  # No deploy needed, exit silently
          fi

          # Get build info from marker
          BUILD_INFO=$(cat "$MARKER_FILE")

          echo "$(date): Starting PickiPedia deploy - $BUILD_INFO" >> "$LOG_FILE"

          # Perform the rsync
          # --delay-updates stages files in temp location, then moves at end (more atomic)
          # Exclude images/ so uploads persist (managed separately)
          # Exclude LocalSettings.local.php (secrets managed separately)
          # Exclude cache/ (runtime generated)
          # Exclude .git directories - no need for version control metadata in prod
          if rsync -vah --delete --delay-updates \
              -e "ssh -i $SSH_KEY -o StrictHostKeyChecking=no" \
              --exclude='.deploy-ready' \
              --exclude='/images/' \
              --exclude='/cache/' \
              --exclude='/LocalSettings.local.php' \
              --exclude='/.git' \
              --exclude='extensions/SemanticMediaWiki/.smw.json' \
              "$BUILD_DIR"/ \
              "$VPS_TARGET" >> "$LOG_FILE" 2>&1; then

              # Fix ownership on VPS
              ssh -i "$SSH_KEY" -o StrictHostKeyChecking=no "root@$VPS_HOST" \
                  "chown -R www-data:www-data /var/www/pickipedia" >> "$LOG_FILE" 2>&1

              # Success - remove marker and log
              rm -f "$MARKER_FILE"
              echo "$(date): PickiPedia deploy successful" >> "$LOG_FILE"

              # Blue Railroad import now handled by Jenkins job (pickipedia-import-bluerailroad)
              # running every even minute via the Python bot
          else
              echo "$(date): PickiPedia deploy FAILED" >> "$LOG_FILE"
              exit 1
          fi

    - name: Remove old NFS deploy cron
      ansible.builtin.cron:
        name: "deploy pickipedia to nfs"
        state: absent

    - name: Cronjob to deploy PickiPedia production builds to VPS
      ansible.builtin.cron:
        name: "deploy pickipedia to vps"
        job: "/usr/local/bin/deploy-pickipedia-to-vps.sh"
        minute: "*/2"

    # ----- hunter VCS backup (host cron) -----
    # hunter keeps, hourly, the git work that exists only there: branches on no remote and
    # uncommitted edits, in any home (hunter housekeeping: hunter-vcs-unpushed). Pulled here
    # with root's hunter key, so hunter can be lost without losing them (Justin, emergence,
    # 1 Nov 2026). latest/ mirrors hunter's; one copy a day is kept for 30 days.
    - name: Create hunter VCS backup pull script
      copy:
        dest: /usr/local/bin/pull-hunter-vcs.sh
        mode: '0750'
        content: |
          #!/bin/bash
          set -euo pipefail
          DIR=/mnt/persist/hunter-vcs
          mkdir -p "$DIR/latest" "$DIR/daily"
          rsync -a --delete root@hunter.cryptograss.live:/opt/magenta/vcs-backup/ "$DIR/latest/"
          today="$DIR/daily/$(date -u +%F)"
          [ -e "$today" ] || cp -al "$DIR/latest" "$today"
          find "$DIR/daily" -mindepth 1 -maxdepth 1 -type d -mtime +30 -exec rm -rf {} +

    - name: Cronjob to pull hunter's unpushed git work
      ansible.builtin.cron:
        name: "pull hunter vcs backup"
        job: "/usr/local/bin/pull-hunter-vcs.sh >> /var/log/pull-hunter-vcs.log 2>&1"
        minute: "20"

    - name: githouse, our canonical copies of the repositories (pushes from hunter's containers land here)
      include_role:
        name: githouse

    - name: Remove old rsync cron if exists
      ansible.builtin.cron:
        name: "push sites to prod"
        state: absent

    # ----- Delivery-kid storage audit (host cron) -----
    # Runs as root on maybelle so audit-storage.py can SSH to delivery-kid
    # using root's existing keys (the same key used by deploy-delivery-kid).
    # Posts a wiki page at Cryptograss:delivery-kid-audits/<blockheight> via
    # the Blue Railroad Imports bot. Deliberately NOT a Jenkins job — keeps
    # delivery-kid SSH access off the jenkins container.
    - name: Create venv and install python deps for delivery-kid audit
      pip:
        virtualenv: /opt/delivery-kid-audit
        # Use stdlib venv instead of the `virtualenv` binary (not installed
        # on maybelle host), and ansible's pip module insists on resolving
        # `virtualenv` on PATH even when the venv already exists.
        virtualenv_command: /usr/bin/python3 -m venv
        name:
          - mwclient
          - pyyaml

    # Holds audit-latest.json (shipped to delivery-kid for the Special
    # page) and last-fingerprint (used to skip per-block wiki page when
    # the problem set hasn't changed).
    - name: Create delivery-kid audit state directory
      file:
        path: /var/lib/delivery-kid-audit
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Deploy delivery-kid audit env file (bot credentials)
      copy:
        dest: /etc/delivery-kid-audit.env
        mode: '0600'
        owner: root
        group: root
        # `quote` wraps in single quotes and escapes embedded single quotes,
        # so passwords with $/`/"/* etc. survive `set -a; . /etc/...env; set +a`
        # in the runner script.
        content: |
          BLUERAILROAD_BOT_USERNAME={{ BLUERAILROAD_BOT_USERNAME | quote }}
          BLUERAILROAD_BOT_PASSWORD={{ BLUERAILROAD_BOT_PASSWORD | quote }}

    - name: Create delivery-kid audit runner script
      copy:
        dest: /usr/local/bin/run-delivery-kid-audit.sh
        mode: '0750'
        owner: root
        group: root
        content: |
          #!/bin/bash
          # Run delivery-kid storage audit, ship the JSON to delivery-kid
          # so the wiki Special:DeliveryKidAudit can render it, and post
          # to PickiPedia if a new problem set was detected.
          # Runs as root: audit-storage.py SSHes to delivery-kid using
          # /root/.ssh keys (same path as deploy-delivery-kid).

          set -uo pipefail

          LOG="/var/log/delivery-kid-audit.log"
          SCRIPT="/mnt/persist/maybelle-config/maybelle/scripts/post-audit-to-wiki.py"
          VENV_PYTHON="/opt/delivery-kid-audit/bin/python"
          STATE_DIR="/var/lib/delivery-kid-audit"
          REMOTE_HOST="delivery-kid.cryptograss.live"
          REMOTE_PATH="/var/lib/delivery-kid-audit/audit-latest.json"

          {
            echo ""
            echo "=== $(date -u +%FT%TZ) audit start ==="
            set -a
            . /etc/delivery-kid-audit.env
            set +a
            "$VENV_PYTHON" "$SCRIPT"
            rc=$?
            # Ship the JSON regardless of audit rc — the Special page wants
            # the latest run's output even if it errored.
            if [ -f "$STATE_DIR/audit-latest.json" ]; then
              if scp -B -o BatchMode=yes "$STATE_DIR/audit-latest.json" \
                   "root@$REMOTE_HOST:$REMOTE_PATH"; then
                echo "shipped audit-latest.json to $REMOTE_HOST"
              else
                echo "WARNING: scp to $REMOTE_HOST failed"
              fi
            else
              echo "WARNING: $STATE_DIR/audit-latest.json missing — nothing to ship"
            fi
            echo "=== $(date -u +%FT%TZ) audit end (rc=$rc) ==="
            exit $rc
          } >> "$LOG" 2>&1

    - name: Ensure delivery-kid audit log file exists
      file:
        path: /var/log/delivery-kid-audit.log
        state: touch
        mode: '0644'
        owner: root
        group: root
        modification_time: preserve
        access_time: preserve

    - name: Cronjob for delivery-kid audit (every 30 minutes)
      ansible.builtin.cron:
        name: "delivery-kid audit"
        job: "/usr/local/bin/run-delivery-kid-audit.sh"
        minute: "0,30"

    - name: Create Jenkins casc_configs/jobs directory
      file:
        path: "{{ jenkins_home }}/casc_configs/jobs"
        state: directory
        mode: '0755'
        owner: 1000
        group: 1000

    - name: Create Jenkins secrets directory
      file:
        path: "{{ jenkins_home }}/secrets/0"
        state: directory
        mode: '0755'
        owner: 1000
        group: 1000

    - name: Deploy justinholmes.com .env file from vault
      copy:
        content: |
          ALCHEMY_API_KEY={{ ALCHEMY_API_KEY }}
          INFURA_API_KEY={{ INFURA_API_KEY }}
          DISCORD_BOT_TOKEN={{ DISCORD_BOT_TOKEN }}
          PINATA_JWT={{ pinata_jwt }}
        dest: "{{ jenkins_home }}/secrets/0/.env"
        mode: '0600'
        owner: 1000
        group: 1000

    - name: Create PickiPedia secrets directory
      file:
        path: "{{ jenkins_home }}/secrets/pickipedia"
        state: directory
        mode: '0755'
        owner: 1000
        group: 1000

    # SMTP configuration for Jenkins email alerts (uptime monitoring)
    # Requires smtp_host, smtp_port, smtp_user, smtp_password in vault
    - name: Deploy msmtp configuration for email alerts
      copy:
        content: |
          # msmtp configuration for Jenkins uptime alerts
          defaults
          auth           on
          tls            on
          tls_trust_file /etc/ssl/certs/ca-certificates.crt
          logfile        /var/jenkins_home/msmtp.log

          account        default
          host           {{ smtp_host | default('smtp.gmail.com') }}
          port           {{ smtp_port | default('587') }}
          from           {{ smtp_from | default('alerts@cryptograss.live') }}
          user           {{ smtp_user | default('') }}
          password       {{ smtp_password | default('') }}
        dest: "{{ jenkins_home }}/.msmtprc"
        mode: '0600'
        owner: 1000
        group: 1000
      when: smtp_user is defined and smtp_user != ''

    - name: Deploy PickiPedia LocalSettings.local.php from vault
      copy:
        content: |
          <?php
          // Secrets deployed from vault - do not edit manually
          // DB settings point to production NFS MySQL
          $wgSecretKey = '{{ pickipedia_secret_key | replace('\\', '\\\\') | replace("'", "\\'") }}';
          $wgUpgradeKey = '{{ pickipedia_upgrade_key | replace('\\', '\\\\') | replace("'", "\\'") }}';
          {% if pickipedia_oauth_secret_key is defined %}
          # OAuth consumer secrets are stored as HMACs keyed with this (Extension:OAuth,
          # Utils::hmacDBSecret). Unset, they're keyed with $wgSecretKey, so rotating that
          # broke every OAuth consumer at once (10 Oct 2026: a 401 on every magenta sign-in
          # and "→ PickiPedia"). Its own vault value, not rotated along with $wgSecretKey.
          $wgOAuthSecretKey = '{{ pickipedia_oauth_secret_key | replace('\\', '\\\\') | replace("'", "\\'") }}';
          {% endif %}
          $wgDBtype = "mysql";
          $wgDBserver = '{{ pickipedia_db_server | replace('\\', '\\\\') | replace("'", "\\'") }}';
          $wgDBname = '{{ pickipedia_db_name | replace('\\', '\\\\') | replace("'", "\\'") }}';
          $wgDBuser = '{{ pickipedia_db_user | replace('\\', '\\\\') | replace("'", "\\'") }}';
          $wgDBpassword = '{{ pickipedia_db_password | replace('\\', '\\\\') | replace("'", "\\'") }}';

          // Error tracking - GlitchTip (Sentry-compatible)
          $wgSentryDsn = '{{ pickipedia_sentry_dsn | default('') | replace('\\', '\\\\') | replace("'", "\\'") }}';

          // Delivery-kid pinning service API key
          $wgDeliveryKidApiKey = '{{ delivery_kid_api_key | replace('\\', '\\\\') | replace("'", "\\'") }}';
          {% if memory_lane_wiki_hook_secret is defined %}
          # Each save, move and upload is pushed to magenta's /api/wiki/hook/, signed with this
          # (extensions/PickiPediaContent/src/MagentaPush.php); the same value is memory-lane's
          # WIKI_HOOK_SECRET above. Unset: no push; magenta's minute sweep alone serves.
          $wgPickiPediaContentMagentaHookSecret = '{{ memory_lane_wiki_hook_secret | replace('\\', '\\\\') | replace("'", "\\'") }}';
          {% endif %}
        dest: "{{ jenkins_home }}/secrets/pickipedia/LocalSettings.local.php"
        mode: '0600'
        owner: 1000
        group: 1000

    - name: Create PR builds directory
      file:
        path: "/var/www/builds"
        state: directory
        mode: '0755'
        owner: www-data
        group: www-data

    # Memory Lane services (Django web UI and MCP server)
    # Using persistent volume for all magenta data
    - name: Create magenta directories on persistent volume
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /mnt/persist/magenta
        - /mnt/persist/magenta/backups

    # Memory Lane's cache (FileBasedCache), kept across deploys: a new container serves the Moods list it had,
    # rather than every page waiting on one rebuilt from nothing (Justin, 1 Nov: ~90 s after a redeploy).
    # Owned by the container's user (magent, uid 1000 in Dockerfile.services).
    - name: Create Memory Lane cache directory
      file:
        path: /mnt/persist/magenta/memory-lane-cache
        state: directory
        owner: '1000'
        group: '1000'
        mode: '0755'

    # Registered because Dockerfile.services ends with `COPY . .` — the source
    # is baked into the image, so new code only reaches the running services if
    # the containers are recreated. See the recreate: line on the compose task
    # below, which keys off this.
    # memory-lane is part of magenta since 18 Oct 2026 (magenta/memory-lane/); its
    # services are built from there. /mnt/persist/magenta/source, the old clone of
    # its own repository, is no longer updated or used.
    # From githouse's copy (the flip, 10 Nov 2026; Cryptograss:Moods/ramp/Plan, section 6), whose main moves
    # only by a signed merge there: a push to GitHub's main, around githouse, never reaches maybelle. No
    # GitHub fallback: githouse is set up earlier in this play, and a fresh one has main within minutes.
    - name: githouse has magenta's main (a fresh githouse fetches it first)
      command: git --git-dir {{ githouse_dir }}/git/magenta.git rev-parse --verify --quiet refs/heads/main
      register: githouse_magenta_main
      changed_when: false
      retries: 30
      delay: 10
      until: githouse_magenta_main.rc == 0

    - name: Clone or update magenta repository (memory-lane is in it)
      git:
        repo: "file://{{ githouse_dir }}/git/magenta.git"
        dest: /mnt/persist/magenta/magenta-source
        version: main
        force: yes
        update: yes
        depth: 1
      environment:
        GIT_TERMINAL_PROMPT: "0"
      register: memory_lane_source

    # Which magenta this deploy runs, for the Moods (report-deploy.sh sends it when the deploy ends; the ramp
    # shows a merge as live on maybelle once it's in this commit).
    - name: Where the deploy report's commits are kept
      file:
        path: /mnt/persist/deploys
        state: directory
        mode: "0755"

    - name: Note the magenta commit for the deploy report
      copy:
        content: "{{ {'magenta': memory_lane_source.after} | to_json }}\n"
        dest: /mnt/persist/deploys/maybelle.commits.json
        mode: "0644"

    # DJANGO_SECRET_KEY: settings.py used to hardcode a key that is public on
    # GitHub. It comes from the vault with no default, so a missing key fails
    # the deploy rather than inventing one.
    - name: Create Memory Lane .env file
      copy:
        dest: /mnt/persist/magenta/magenta-source/memory-lane/.env
        content: |
          POSTGRES_HOST=magenta-postgres
          POSTGRES_PORT=5432
          POSTGRES_DB=magenta_memory
          POSTGRES_USER=magent
          POSTGRES_PASSWORD={{ memory_lane_postgres_password }}
          DJANGO_ALLOWED_HOSTS=memory-lane.maybelle.cryptograss.live,magenta.cryptograss.live,localhost,10.0.0.2
          DJANGO_DEBUG=False
          INGEST_API_KEY={{ ingest_api_key }}
          SCRUBBER_URL=http://scrubber:8001
          DJANGO_SECRET_KEY={{ memory_lane_django_secret_key }}
          MOOD_ALLOWED_SIGNERS=/etc/magenta/allowed_signers
          MAGENTA_COMMIT={{ (memory_lane_source.after | default(''))[:12] }}
          MAGENTA_BACKUP_DIR=/mnt/persist/magenta/backups
          # Each person's PickiPedia name, shown in magenta (memory-lane wiki_auth.py).
          MOOD_WIKI_NAMES=/etc/magenta/wiki_names
          # Who may kick, ban, scram (magenta.sh AZ5) and lift, with their SSH
          # key (memory-lane views_admin.py). Unset: nobody can.
          MOOD_ADMINS={{ memory_lane_motion_admins | default('justin') }}
          # The merge button (Plan, section 10): who may press it, and the key it signs with. githouse checks both
          # again itself; these only decide what memory-lane offers and signs.
          GITHOUSE_MERGERS={{ githouse_mergers | join(',') }}
          MERGE_KEY_PATH=/etc/magenta/merge_key
          # Tool I/O is kept now that pattern redaction exists (jMyles/memory-lane#26);
          # this caps each stored result.
          TOOL_RESULT_CONTENT_CHARS=20000
          {% set magent_key = magent_runner_key | default('') %}
          {% if magent_key %}
          # The Mood runners (memory-lane's poller, on hunter, one per agent)
          # stream the turns they wake straight into their Moods, each proving
          # itself with its agent's key: one line per agent, read by
          # memory-lane (memory_viewer/runner_keys.py).
          MOOD_RUNNER_KEY_MAGENT={{ magent_key }}
          {% endif %}
          {% if re_runner_key is defined %}
          MOOD_RUNNER_KEY_RE={{ re_runner_key }}
          {% endif %}
          {% if blu_runner_key is defined %}
          MOOD_RUNNER_KEY_BLU={{ blu_runner_key }}
          {% endif %}
          {% if memory_lane_deploy_key is defined %}
          # The deploy scripts here (scripts/report-deploy.sh) tell the Moods
          # when a server is being redeployed, proving themselves with this key.
          MOOD_DEPLOY_KEY={{ memory_lane_deploy_key }}
          {% endif %}
          {% if memory_lane_access_key is defined %}
          # Hunter's SSH router (hunter route-ssh, announce-ssh) says who has
          # come in by SSH, proving itself with this key; it can do nothing else.
          MOOD_ACCESS_KEY={{ memory_lane_access_key }}
          {% endif %}
          {% if memory_lane_alarm_key is defined %}
          # maybelle's Jenkins jobs (scripts/report-alarm.sh) say in #ops when a check
          # turns red or green, proving themselves with this key; it can do nothing else.
          MOOD_ALARM_KEY={{ memory_lane_alarm_key }}
          {% endif %}
          {% if pickipedia_oauth_client_id is defined and pickipedia_oauth_client_secret is defined %}
          # "Sign in with PickiPedia": magenta's client at the wiki's OAuth
          # extension (Special:OAuthConsumerRegistration). A wiki sign-in chats
          # and mentions people; waking agents still takes an SSH key.
          PICKIPEDIA_OAUTH_CLIENT_ID={{ pickipedia_oauth_client_id }}
          PICKIPEDIA_OAUTH_CLIENT_SECRET={{ pickipedia_oauth_client_secret }}
          {% endif %}
          {% if elevenlabs_api_key is defined %}
          # Voice in Moods (memory-lane services/voice.py): memos transcribed,
          # messages read aloud. A key restricted to TTS, STT and reading voices.
          ELEVENLABS_API_KEY={{ elevenlabs_api_key }}
          {% endif %}
          {% if memory_lane_webpush_vapid_key is defined %}
          # Notifications with magenta closed (memory-lane services/push.py):
          # the VAPID private key every push is signed with. Make one with
          # `python3 manage.py vapid_key`; changing it means each device turns
          # its bell on again.
          WEBPUSH_VAPID_PRIVATE_KEY={{ memory_lane_webpush_vapid_key }}
          {% endif %}
          {% if memory_lane_recovery_public_key is defined %}
          # Editing and deleting in Moods (memory-lane services/retract.py): what's
          # taken back is sealed to this public key first, so it can be put back
          # (manage.py unseal) by whoever holds the private half -- kept offline,
          # never in the vault or on any server. Unset: nothing can be taken back.
          MOOD_RECOVERY_PUBLIC_KEY={{ memory_lane_recovery_public_key }}
          {% endif %}
          {% if pickipedia_todo_bot_password is defined %}
          # A merged pull request's to-do item, ticked on PickiPedia too (memory-lane
          # services/todo_ticks.py): DrivingThatTrain's "magenta-todo" bot password,
          # with "Edit existing pages" and "High-volume (bot) access".
          PICKIPEDIA_TODO_BOT_USER={{ pickipedia_todo_bot_user | default('DrivingThatTrain@magenta-todo') }}
          PICKIPEDIA_TODO_BOT_PASSWORD={{ pickipedia_todo_bot_password }}
          {% endif %}
          {% if memory_lane_github_webhook_secret is defined %}
          # A Mood's to-do list ticks a merged pull request at once (memory-lane
          # services/todo.py): GitHub's webhook (pull requests) to
          # https://magenta.cryptograss.live/api/github/hook/, signed with this.
          # Unset: lists tick on their own, minutes later.
          GITHUB_WEBHOOK_SECRET={{ memory_lane_github_webhook_secret }}
          {% endif %}
          {% if memory_lane_wiki_hook_secret is defined %}
          # PickiPedia pushes each save, move and upload to
          # https://magenta.cryptograss.live/api/wiki/hook/ (memory-lane
          # services/wiki_hooks.py), signed with this: the same value is the
          # wiki's $wgPickiPediaContentMagentaHookSecret (LocalSettings.local.php
          # on the wiki host). Make it with `openssl rand -hex 32`. Unset: the
          # minute sweep alone, and no push is expected.
          WIKI_HOOK_SECRET={{ memory_lane_wiki_hook_secret }}
          {% endif %}
          {% if pickipedia_upload_oauth_client_id is defined and pickipedia_upload_oauth_client_secret is defined %}
          # "→ PickiPedia" under a picture sent into a Mood (memory-lane
          # services/wiki_upload.py): a second OAuth 2 consumer, "magenta
          # uploads", that uploads as the picture's sharer, once, with their
          # yes. Callback https://magenta.cryptograss.live/moods/auth/wiki/upload;
          # grants: upload new files, create/edit/move pages, edit existing
          # pages. Unset: pictures stay in magenta, with no button.
          PICKIPEDIA_UPLOAD_CLIENT_ID={{ pickipedia_upload_oauth_client_id }}
          PICKIPEDIA_UPLOAD_CLIENT_SECRET={{ pickipedia_upload_oauth_client_secret }}
          {% endif %}
          {% if faces_api_key is defined %}
          # "Who's in it?" on a photo in a Mood (memory-lane services/faces.py):
          # the faces service on hunter (hunter/ansible/roles/faces), with the
          # same key it was deployed with. Unset: no button, nothing sent.
          FACES_URL=https://faces.hunter.cryptograss.live
          FACES_KEY={{ faces_api_key }}
          {% endif %}
          {% if delivery_kid_upload_key is defined %}
          # Videos sent into a Mood go to delivery-kid (memory-lane
          # services/delivery_kid.py): magenta mints each person an upload
          # token with this key, so the key never reaches a browser. It is
          # delivery-kid's upload-only key, not its API key: it can sign upload
          # tokens and nothing else (no finalize, no X-API-Key). Make it with
          # `openssl rand -hex 32`. Unset: videos can't be sent to delivery-kid.
          DELIVERY_KID_UPLOAD_KEY={{ delivery_kid_upload_key }}
          DELIVERY_KID_URL=https://delivery-kid.cryptograss.live
          {% endif %}
        mode: '0600'
      register: memory_lane_env

    - name: Create docker network for memory lane
      docker_network:
        name: memory-lane-net
        state: present

    # PostgreSQL for Memory Lane
    # Exposed on 10.0.0.2 (Hetzner private network) for dev access from hunter
    - name: Include postgres role
      include_role:
        name: postgres
      vars:
        base_dir: /mnt/persist/magenta
        postgres_password: "{{ memory_lane_postgres_password }}"
        postgres_db: magenta_memory
        postgres_network: memory-lane-net
        postgres_network_external: true
        postgres_bind_address: "10.0.0.2"  # Hetzner private network - allows hunter to connect

    # Who may write into Moods (jMyles/memory-lane#27): each person on the
    # team, by the SSH key hunter already knows them by. A Mood signed with
    # `ssh-keygen -Y sign -n magenta-moods` verifies against this file.
    # Users whose key is empty or still a placeholder get no line.
    # Read with lookup('file') | from_yaml, not include_vars: that inventory
    # carries hunter-vault templates ({{ code_server_password }} and friends),
    # and on ansible-core 2.16 touching an include_vars'd dict renders all of
    # it, failing on vars that only hunter's vault defines.
    - name: Write Moods allowed_signers
      copy:
        dest: /mnt/persist/magenta/allowed_signers
        mode: '0644'
        content: |
          {% for user in (lookup('file', playbook_dir ~ '/../../hunter/ansible/inventory.yml') | from_yaml).all.vars.people if (user.ssh_pubkey | default('') | trim) is match('ssh-') %}
          {{ user.name }} namespaces="magenta-moods" {{ user.ssh_pubkey | trim }}
          {% endfor %}
      register: mood_allowed_signers

    # The merge button's key (Plan, section 10): readable only by memory-lane's user (uid 1000, magent in its
    # image). As the vault holds it, base64 or not: memory-lane reads either (services/merge_orders.py). Not in
    # the vault: an empty file, and memory-lane offers no button.
    - name: memory-lane's merge key
      copy:
        dest: /mnt/persist/magenta/merge_key
        owner: '1000'
        group: '1000'
        mode: '0400'
        content: "{{ memory_lane_merge_key | default('') | trim }}\n"
      no_log: true
      register: memory_lane_merge_key_file

    # Each person's PickiPedia name, from the same inventory: memory-lane shows
    # people by it, links it to their wiki user page, and takes @-mentions by it.
    - name: Write Moods wiki_names
      copy:
        dest: /mnt/persist/magenta/wiki_names
        mode: '0644'
        content: |
          {% for user in (lookup('file', playbook_dir ~ '/../../hunter/ansible/inventory.yml') | from_yaml).all.vars.people if user.pickipedia | default('') | trim %}
          {{ user.name }} {{ user.pickipedia | trim }}
          {% endfor %}
      register: mood_wiki_names

    - name: Create Memory Lane docker-compose file
      copy:
        dest: /mnt/persist/magenta/magenta-source/memory-lane/docker-compose.maybelle.yml
        content: |
          services:
            memory-lane:
              build:
                context: .
                dockerfile: Dockerfile.services
              container_name: memory-lane
              env_file: .env
              environment:
                - DJANGO_SETTINGS_MODULE=memory_viewer.settings
                - MEMORY_LANE_CACHE_DIR=/var/cache/memory-lane
              ports:
                - "127.0.0.1:3000:3000"
                - "10.0.0.2:3000:3000"
              volumes:
                - /mnt/persist/magenta/allowed_signers:/etc/magenta/allowed_signers:ro
                - /mnt/persist/magenta/merge_key:/etc/magenta/merge_key:ro
                - /mnt/persist/magenta/wiki_names:/etc/magenta/wiki_names:ro
                - /mnt/persist/magenta/backups:/mnt/persist/magenta/backups:ro
                - /mnt/persist/magenta/memory-lane-cache:/var/cache/memory-lane
                # githouse's branches.json (every repository's branches), served at /api/branches/
                - {{ githouse_dir }}/git:/srv/git:ro
              networks:
                - memory-lane-net
              restart: unless-stopped
              # Threads, and room to wait: transcribing a voice memo or voicing a
              # message takes ElevenLabs a while, and must neither be cut off at
              # gunicorn's default 30 s nor hold up every page's polling meanwhile.
              command: gunicorn --bind 0.0.0.0:3000 --workers 4 --threads 8 --timeout 120 --access-logfile - memory_viewer.wsgi:application

            mcp-server:
              build:
                context: .
                dockerfile: Dockerfile.services
              container_name: mcp-server
              env_file: .env
              environment:
                - DJANGO_SETTINGS_MODULE=memory_viewer.settings
              ports:
                - "10.0.0.2:8000:8000"
              networks:
                - memory-lane-net
              restart: unless-stopped
              stdin_open: true
              tty: true
              command: python manage.py run_mcp_server_v2 --port 8000

            scrubber:
              build:
                context: ./scrubber
                dockerfile: Dockerfile
              container_name: scrubber
              environment:
                - SECRETS_FILE=/app/secrets/secrets.json
              volumes:
                - scrubber-secrets:/app/secrets
              networks:
                - memory-lane-net
              restart: unless-stopped
              read_only: true
              security_opt:
                - no-new-privileges:true

          volumes:
            scrubber-secrets:

          networks:
            memory-lane-net:
              external: true
              name: memory-lane-net
        mode: '0644'
      register: memory_lane_compose

    # recreate: the images bake the source in, and `state: present` alone will
    # happily leave an old container running against a freshly built image.
    # That is what happened on 2026-09-25: the clone advanced to 3835a3a, the
    # play reported success, and memory-lane and mcp-server stayed up for three
    # weeks on stale code — so a merged migration never ran and a merged MCP
    # tool never appeared. Recreate whenever new source arrived, or on
    # --rebuild; otherwise leave the containers alone.
    # .env, the compose file, allowed_signers and wiki_names count as new source too.
    # Those two are bind-mounted as single files, and Ansible's copy
    # replaces a file by rename, so a running container would keep reading the
    # old inode; it has to be recreated to see a changed roster.
    # project_name: the name compose gave it when it ran from /mnt/persist/magenta/source.
    # Kept, so the same containers are recreated (not a second set beside them) and the
    # scrubber keeps its volume, source_scrubber-secrets.
    - name: Start Memory Lane services
      community.docker.docker_compose_v2:
        project_src: /mnt/persist/magenta/magenta-source/memory-lane
        project_name: source
        files:
          - docker-compose.maybelle.yml
        build: always
        state: present
        recreate: "{{ 'always' if (memory_lane_source.changed or memory_lane_env.changed or memory_lane_compose.changed or mood_allowed_signers.changed or mood_wiki_names.changed or memory_lane_merge_key_file.changed or (rebuild_images | default(false) | bool)) else 'auto' }}"

    # Inject secrets into scrubber container (from temp file created by chapter-1.sh)
    - name: Check if scrubber secrets temp file exists
      stat:
        path: /tmp/scrubber-secrets.json
      register: scrubber_secrets_file

    # githouse refuses a push carrying any of these (shared/githouse/githouse.py, check_secrets): the same
    # list, as SHA-256 hashes and lengths, never the values (re, #ramp, 10 Nov: a bug in the git user's
    # forced command then leaks no vault), readable by githouse's git user alone, as jenkins_reporter is.
    # Kept here, not asked of memory-lane: a push's content goes nowhere else, and memory-lane being down
    # neither blocks every push nor skips the check (re). Refreshed whenever chapter 1 brings the list;
    # until the first, githouse checks secrets' shapes only.
    - name: githouse refuses a push carrying any of the vault's values (their hashes)
      shell: |
        set -e
        umask 077
        python3 {{ githouse_dir }}/build/githouse.py hash-secrets < /tmp/scrubber-secrets.json > {{ githouse_dir }}/etc/secret-hashes.json.tmp
        chown 2999 {{ githouse_dir }}/etc/secret-hashes.json.tmp
        chmod 0400 {{ githouse_dir }}/etc/secret-hashes.json.tmp
        mv -f {{ githouse_dir }}/etc/secret-hashes.json.tmp {{ githouse_dir }}/etc/secret-hashes.json
      no_log: true
      when: scrubber_secrets_file.stat.exists

    - name: Copy secrets into scrubber container
      shell: docker cp /tmp/scrubber-secrets.json scrubber:/app/secrets/secrets.json
      when: scrubber_secrets_file.stat.exists

    - name: Fix secrets file ownership in container
      shell: docker exec -u root scrubber chown scrubber:scrubber /app/secrets/secrets.json
      when: scrubber_secrets_file.stat.exists

    - name: Remove temp secrets file
      file:
        path: /tmp/scrubber-secrets.json
        state: absent
      when: scrubber_secrets_file.stat.exists

    - name: Restart scrubber to load secrets
      shell: docker restart scrubber
      when: scrubber_secrets_file.stat.exists

    - name: Wait for postgres to be ready
      command: docker exec magenta-postgres pg_isready -U magent
      register: pg_ready
      until: pg_ready.rc == 0
      retries: 10
      delay: 2

    - name: Run Django migrations
      command: docker exec memory-lane python manage.py migrate --noinput

    - name: Copy secrets check script into memory-lane container
      shell: docker cp {{ playbook_dir }}/../../scripts/check_db_for_secrets.py memory-lane:/app/check_db_for_secrets.py

    # Restore from backup if database is empty
    # Uses pg_dump custom format (.dump) which avoids psql \restrict issues
    - name: Check if database has data
      shell: docker exec magenta-postgres psql -U magent -d magenta_memory -t -c "SELECT COUNT(*) FROM conversations_message;" 2>/dev/null || echo "0"
      register: db_message_count
      changed_when: false

    - name: List available backups
      shell: |
        ls -lhS /mnt/persist/magenta/backups/magenta_memory_*.dump /mnt/persist/magenta/backups/magenta_memory_*.sql.gz 2>/dev/null | awk '{print NR") "$5" "$9}'
      register: available_backups
      when: db_message_count.stdout | trim | int == 0

    - name: Show available backups
      debug:
        msg: "{{ available_backups.stdout_lines }}"
      when:
        - db_message_count.stdout | trim | int == 0
        - available_backups.stdout | length > 0

    - name: Prompt for backup selection
      pause:
        prompt: "Enter number to restore (1, 2, etc) or 's' to skip"
      register: backup_selection
      when:
        - db_message_count.stdout | trim | int == 0
        - available_backups.stdout | length > 0

    - name: Get selected backup filename
      shell: |
        ls -lhS /mnt/persist/magenta/backups/magenta_memory_*.dump /mnt/persist/magenta/backups/magenta_memory_*.sql.gz 2>/dev/null | awk 'NR=={{ backup_selection.user_input }} {print $9}'
      register: selected_backup
      when:
        - db_message_count.stdout | trim | int == 0
        - backup_selection.user_input | default('s') != 's'
        - backup_selection.user_input | int > 0

    - name: Restore from selected backup
      shell: |
        BACKUP_FILE="{{ selected_backup.stdout }}"
        # Convert host path to container path (/mnt/persist/magenta/backups -> /backups)
        CONTAINER_PATH="/backups/$(basename "$BACKUP_FILE")"
        if [[ "$BACKUP_FILE" == *.dump ]]; then
          # Custom format: use pg_restore with file inside container
          docker exec magenta-postgres pg_restore -U magent -d magenta_memory --no-owner --no-privileges "$CONTAINER_PATH"
        else
          # Legacy plain-text format: use psql (strip \restrict line for pg16+ compatibility)
          gunzip -c "$BACKUP_FILE" | grep -v '^\\restrict ' | docker exec -i magenta-postgres psql -U magent -d magenta_memory
        fi
      when:
        - db_message_count.stdout | trim | int == 0
        - selected_backup.stdout | default('') | length > 0
      register: restore_result

    - name: Report restore status
      debug:
        msg: "Restored database from {{ selected_backup.stdout }}"
      when: restore_result is defined and restore_result.changed | default(false)

    # A restricted role for memory-lane previews (tools/preview.sh on hunter),
    # which run a branch's unreviewed code against the live record. They used
    # to connect as magent, the superuser, with only a per-session read-only
    # default between them and the data. memory_lane_preview reads every table
    # and writes only what posting a Mood turn (api_say) and signing in a
    # device (mood_auth) write. Placed after migrations and any restore so
    # the grants cover every table that exists.
    # The password comes from the vault with no default: until it is there,
    # the role is left alone rather than given an invented secret.
    - name: Note missing memory-lane preview role password
      debug:
        msg: "memory_lane_preview_db_password is not in secrets/vault.yml; skipping the memory_lane_preview role. Previews keep connecting as magent."
      when: memory_lane_preview_db_password is not defined

    # The password reaches psql through the environment and \getenv, never
    # argv, and is quoted by psql (:'preview_pw'). The statement logging is
    # turned off for this session so a failed ALTER can't write it to the log.
    - name: Create or update memory-lane preview role
      command: docker exec -i -e MEMORY_LANE_PREVIEW_DB_PASSWORD magenta-postgres psql -U magent -d magenta_memory -v ON_ERROR_STOP=1 -q
      args:
        stdin: |
          SET log_statement = 'none';
          SET log_min_error_statement = panic;
          \getenv preview_pw MEMORY_LANE_PREVIEW_DB_PASSWORD
          SELECT 'CREATE ROLE memory_lane_preview' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'memory_lane_preview') \gexec
          ALTER ROLE memory_lane_preview WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS CONNECTION LIMIT 10 PASSWORD :'preview_pw';
      environment:
        MEMORY_LANE_PREVIEW_DB_PASSWORD: "{{ memory_lane_preview_db_password }}"
      no_log: true
      when: memory_lane_preview_db_password is defined

    # REVOKE first, in the same transaction, so the role converges on exactly
    # this list each deploy (revoking a table also drops its column grants).
    # Default privileges make tables from future migrations readable too.
    # Except the tables holding live credentials and admin sessions: a preview
    # needs none of them (Moods pages, /api/ and SSH sign-in never touch
    # request.session or request.user), and reading django_session would let
    # unreviewed code take over a live admin session. to_regclass skips any
    # that don't exist (authtoken_token only appears with DRF's authtoken).
    - name: Grant memory-lane preview role its privileges
      command: docker exec -i magenta-postgres psql -U magent -d magenta_memory -v ON_ERROR_STOP=1 -q
      args:
        stdin: |
          BEGIN;
          GRANT CONNECT ON DATABASE magenta_memory TO memory_lane_preview;
          GRANT USAGE ON SCHEMA public TO memory_lane_preview;
          REVOKE ALL ON ALL TABLES IN SCHEMA public FROM memory_lane_preview;
          GRANT SELECT ON ALL TABLES IN SCHEMA public TO memory_lane_preview;
          DO $$
          DECLARE t text;
          BEGIN
            FOREACH t IN ARRAY ARRAY['django_session', 'auth_user', 'auth_user_groups', 'auth_user_user_permissions', 'authtoken_token'] LOOP
              IF to_regclass(format('public.%I', t)) IS NOT NULL THEN
                EXECUTE format('REVOKE SELECT ON public.%I FROM memory_lane_preview', t);
              END IF;
            END LOOP;
          END $$;
          ALTER DEFAULT PRIVILEGES FOR ROLE magent IN SCHEMA public GRANT SELECT ON TABLES TO memory_lane_preview;
          GRANT INSERT ON conversations_message, devices, login_codes TO memory_lane_preview;
          -- Images posted in a preview (memory-lane migration 0007); skipped
          -- until that migration has made the table.
          DO $$
          BEGIN
            IF to_regclass('public.media') IS NOT NULL THEN
              GRANT INSERT ON public.media TO memory_lane_preview;
            END IF;
            -- Settings changed in a preview (memory-lane migration 0009):
            -- rows are only ever added, so this too adds, never changes.
            IF to_regclass('public.settings') IS NOT NULL THEN
              GRANT INSERT ON public.settings TO memory_lane_preview;
            END IF;
          END $$;
          GRANT UPDATE (used_at) ON login_codes TO memory_lane_preview;
          GRANT UPDATE (last_used_at, revoked_at) ON devices TO memory_lane_preview;
          -- Renaming a Mood in a preview (memory-lane migration 0014 made
          -- moods): its title, description and the slug that follows them, and
          -- the alias the old slug becomes. The old name stays in the record
          -- (a system row the rename adds). Read marks (migration 0011): a
          -- preview keeps its reader's place. Guarded, so a deploy before or
          -- after a migration never fails on a table that isn't there.
          DO $$
          BEGIN
            IF to_regclass('public.moods') IS NOT NULL THEN
              GRANT UPDATE (slug, title, description) ON public.moods TO memory_lane_preview;
            END IF;
            IF to_regclass('public.mood_aliases') IS NOT NULL THEN
              GRANT INSERT, DELETE ON public.mood_aliases TO memory_lane_preview;
              GRANT USAGE ON SEQUENCE public.mood_aliases_id_seq TO memory_lane_preview;
            END IF;
            IF to_regclass('public.read_marks') IS NOT NULL THEN
              GRANT INSERT, UPDATE (seen_at) ON public.read_marks TO memory_lane_preview;
              GRANT USAGE ON SEQUENCE public.read_marks_id_seq TO memory_lane_preview;
            END IF;
          END $$;
          COMMIT;
      when: memory_lane_preview_db_password is defined

    # PostgreSQL backups (backup directory already created above)
    # Uses custom format (-Fc) which is compressed and avoids psql \restrict issues
    - name: Create postgres backup script
      copy:
        dest: /mnt/persist/magenta/backup-postgres.sh
        mode: '0750'
        content: |
          #!/bin/bash
          # Bi-hourly postgres backup
          # Uses pg_dump custom format (-Fc) for reliable cross-server restores
          # Backups named by Ethereum block height for temporal anchoring
          BACKUP_DIR="/mnt/persist/magenta/backups"
          DAILY_DIR="$BACKUP_DIR/daily"

          # Ensure daily directory exists
          mkdir -p "$DAILY_DIR"

          # Get current Ethereum block height
          BLOCK_HEIGHT=$(curl -s https://eth.blockscout.com/api/v2/stats | jq -r .total_blocks)
          if [ -z "$BLOCK_HEIGHT" ] || [ "$BLOCK_HEIGHT" = "null" ]; then
              # Fallback to timestamp if block fetch fails
              BLOCK_HEIGHT="ts_$(date +%Y%m%d_%H%M%S)"
              echo "$(date): WARNING - Could not fetch block height, using timestamp" >> "$BACKUP_DIR/backup.log"
          fi

          BACKUP_FILE="$BACKUP_DIR/magenta_memory_${BLOCK_HEIGHT}.dump"

          # Don't dump into a full volume (2 Nov 2026: /mnt/persist hit 100%, and a dump
          # written then is truncated). Need room for twice the last dump, or 2G with none.
          LAST=$(ls -t "$BACKUP_DIR"/magenta_memory_*.dump 2>/dev/null | head -1)
          NEED_KB=2097152
          [ -n "$LAST" ] && NEED_KB=$(( $(stat -c%s "$LAST") / 512 ))
          FREE_KB=$(df -Pk "$BACKUP_DIR" | awk 'NR==2 {print $4}')
          if [ "$FREE_KB" -lt "$NEED_KB" ]; then
              echo "$(date): SKIPPED - ${FREE_KB}K free, need ${NEED_KB}K" >> "$BACKUP_DIR/backup.log"
              exit 1
          fi

          # Dump in custom format (already compressed)
          docker exec magenta-postgres pg_dump -Fc -U magent magenta_memory > "$BACKUP_FILE"
          DUMP_STATUS=$?

          # A dump that failed, or doesn't read back to the end, is truncated or broken:
          # never keep it, so it can't become the daily or the offsite copy. Reading it
          # through to /dev/null catches a cut-off data section, which --list alone wouldn't.
          if [ "$DUMP_STATUS" -ne 0 ] || ! docker exec -i magenta-postgres pg_restore -f /dev/null < "$BACKUP_FILE" > /dev/null 2>&1; then
              echo "$(date): FAILED - $BACKUP_FILE did not verify; removed" >> "$BACKUP_DIR/backup.log"
              rm -f "$BACKUP_FILE"
              exit 1
          fi

          # Log
          echo "$(date): Backup created: $BACKUP_FILE ($(stat -c%s "$BACKUP_FILE") bytes)" >> "$BACKUP_DIR/backup.log"

          # Keep one daily backup (copy the 3am backup to daily folder)
          HOUR=$(date +%H)
          if [ "$HOUR" = "03" ]; then
              cp "$BACKUP_FILE" "$DAILY_DIR/"
              echo "$(date): Daily backup saved to $DAILY_DIR" >> "$BACKUP_DIR/backup.log"
              # Keep daily backups for 7 days (offsite backup handles long-term)
              find "$DAILY_DIR" -name "magenta_memory_*.dump" -mtime +7 -delete
          fi

          # Cleanup bi-hourly backups (keep the last 12 hours - ~6 dumps, ~6G at 1G each;
          # 24 hours took ~12G of a 40G volume). Dailies cover the longer window.
          find "$BACKUP_DIR" -maxdepth 1 -name "magenta_memory_*.dump" -mmin +720 -delete
          find "$BACKUP_DIR" -maxdepth 1 -name "magenta_memory_*.sql.gz" -mtime +0 -delete

    # Odd hours: the script keeps the 03:00 dump as the day's, and */2 (0, 2, 4...)
    # never ran at 03, so daily/ -- and the 04:00 offsite copy of it -- had nothing.
    - name: Schedule bi-hourly postgres backup
      ansible.builtin.cron:
        name: "postgres bi-hourly backup"
        hour: "1-23/2"
        minute: "0"
        job: "/mnt/persist/magenta/backup-postgres.sh"

    # Give new messages their Ethereum block heights (jMyles/memory-lane#18).
    # Ingest never calls a node; this fills eth_blockheight afterwards.
    # flock: the first run backfills the whole corpus and may outlast 5 min.
    # Two timeouts: docker exec doesn't forward signals (moby#9098), so the
    # host-side one kills only the client and a hung stamper would outlive the
    # flock. The inner 30m kills the stamper itself; the outer 35m only covers
    # a stuck docker client.
    - name: Schedule memory-lane block height stamping
      ansible.builtin.cron:
        name: "memory-lane stamp blockheights"
        minute: "*/5"
        job: "flock -n /tmp/stamp-blockheights.lock timeout 35m docker exec memory-lane timeout 30m python manage.py stamp_blockheights >> /var/log/memory-lane-blockheights.log 2>&1"

    # Agents' tasks (memory-lane services/tasks.py): each minute, start any
    # whose schedule on its PickiPedia page has come round. Once a slot; a
    # slot missed by more than an hour is let go. Timeouts as above.
    - name: Schedule agents' due tasks
      ansible.builtin.cron:
        name: "memory-lane run due tasks"
        minute: "*"
        job: "flock -n /tmp/run-due-tasks.lock timeout 5m docker exec memory-lane timeout 4m python manage.py run_due_tasks >> /var/log/memory-lane-tasks.log 2>&1"

    - name: Rotate the agents' tasks log
      copy:
        dest: /etc/logrotate.d/memory-lane-tasks
        mode: '0644'
        content: |
          /var/log/memory-lane-tasks.log {
              weekly
              rotate 4
              compress
              missingok
              notifempty
              copytruncate
          }

    - name: Rotate the block height stamping log
      copy:
        dest: /etc/logrotate.d/memory-lane-blockheights
        mode: '0644'
        content: |
          /var/log/memory-lane-blockheights.log {
              weekly
              rotate 4
              compress
              missingok
              notifempty
              copytruncate
          }

    - name: Remove old daily backup cron if exists
      ansible.builtin.cron:
        name: "postgres daily backup"
        state: absent

    - name: Create offsite backup script
      copy:
        dest: /usr/local/bin/backup-to-nfs.sh
        mode: '0750'
        content: |
          #!/bin/bash
          # Sync daily backups to NearlyFreeSpeech for offsite storage
          LOG_FILE="/var/log/nfs-backup.log"
          BACKUP_DIR="/mnt/persist/magenta/backups/daily"
          NFS_TARGET="jmyles_justinholmescom@ssh.nyc1.nearlyfreespeech.net:/home/private/backups/"

          echo "$(date): Starting offsite backup sync" >> "$LOG_FILE"

          if rsync -avz --delete \
              -e "ssh -i /root/.ssh/id_ed25519_nfs -o StrictHostKeyChecking=no" \
              "$BACKUP_DIR"/ \
              "$NFS_TARGET" >> "$LOG_FILE" 2>&1; then
              echo "$(date): Offsite backup sync successful" >> "$LOG_FILE"
          else
              echo "$(date): Offsite backup sync FAILED" >> "$LOG_FILE"
              exit 1
          fi

    - name: Schedule daily offsite backup sync
      ansible.builtin.cron:
        name: "offsite backup to nfs"
        hour: "4"
        minute: "0"
        job: "/usr/local/bin/backup-to-nfs.sh"

    # PickiPedia backup - pull MySQL dump from NFS for hunter preview
    - name: Create pickipedia backup directory
      file:
        path: /mnt/persist/pickipedia/backups
        state: directory
        mode: '0755'

    - name: Deploy pickipedia backup script
      copy:
        src: "{{ playbook_dir }}/../scripts/backup-pickipedia.sh"
        dest: /usr/local/bin/backup-pickipedia.sh
        mode: '0750'

    - name: Deploy pickipedia MySQL credentials for backup
      copy:
        content: |
          [client]
          user={{ pickipedia_db_user }}
          password={{ pickipedia_db_password }}
        dest: /root/.pickipedia-my.cnf
        mode: '0600'

    - name: Create pickipedia backup log file
      file:
        path: /var/log/pickipedia-backup.log
        state: touch
        mode: '0644'

    - name: Schedule daily pickipedia backup
      ansible.builtin.cron:
        name: "pickipedia backup from vps"
        hour: "3"
        minute: "30"
        job: "/usr/local/bin/backup-pickipedia.sh"

    - name: Remove old NFS backup cron
      ansible.builtin.cron:
        name: "pickipedia backup from nfs"
        state: absent

    - name: Add PickiPedia VPS to SSH config
      blockinfile:
        path: /root/.ssh/config
        marker: "# {mark} PICKIPEDIA VPS"
        block: |
          Host pickipedia-vps
            HostName 5.78.112.39
            IdentityFile ~/.ssh/id_ed25519_hunter
            User root

    - name: Remove old NFS SSH config
      blockinfile:
        path: /root/.ssh/config
        marker: "# {mark} PICKIPEDIA NFS"
        state: absent

    # Security: remove vault password after deploy completes
    # The encrypted vault.yml is in a public repo, so vault password on disk is a risk
    # Re-run chapter-1.sh to restore it if needed for future deploys
    - name: Remove vault password file
      file:
        path: /mnt/persist/.vault-password
        state: absent

    - name: Clean up old scrubber secrets directory if exists
      file:
        path: /mnt/persist/scrubber-secrets
        state: absent

    # GlitchTip - open source Sentry alternative for error tracking
    - name: Create GlitchTip directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - /mnt/persist/glitchtip
        - /mnt/persist/glitchtip/postgres-data

    - name: Create GlitchTip docker network
      docker_network:
        name: glitchtip-net
        state: present

    - name: Create GlitchTip docker-compose file
      copy:
        dest: /mnt/persist/glitchtip/docker-compose.yml
        mode: '0644'
        content: |
          services:
            postgres:
              image: postgres:15
              container_name: glitchtip-postgres
              environment:
                POSTGRES_DB: glitchtip
                POSTGRES_USER: glitchtip
                POSTGRES_PASSWORD: {{ glitchtip_postgres_password }}
              volumes:
                - /mnt/persist/glitchtip/postgres-data:/var/lib/postgresql/data
              networks:
                - glitchtip-net
              restart: unless-stopped
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U glitchtip"]
                interval: 5s
                timeout: 5s
                retries: 10

            redis:
              image: redis:7-alpine
              container_name: glitchtip-redis
              networks:
                - glitchtip-net
              restart: unless-stopped

            web:
              image: glitchtip/glitchtip:latest
              container_name: glitchtip-web
              depends_on:
                postgres:
                  condition: service_healthy
                redis:
                  condition: service_started
              ports:
                - "127.0.0.1:8800:8080"
              environment:
                DATABASE_URL: postgres://glitchtip:{{ glitchtip_postgres_password }}@postgres:5432/glitchtip
                REDIS_URL: redis://redis:6379/0
                SECRET_KEY: {{ glitchtip_secret_key }}
                GLITCHTIP_DOMAIN: https://glitchtip.maybelle.cryptograss.live
                DEFAULT_FROM_EMAIL: glitchtip@cryptograss.live
                EMAIL_URL: "consolemail://"
                ENABLE_OPEN_USER_REGISTRATION: "True"
                GLITCHTIP_MAX_EVENT_LIFE_DAYS: "14"
              networks:
                - glitchtip-net
              restart: unless-stopped

            worker:
              image: glitchtip/glitchtip:latest
              container_name: glitchtip-worker
              depends_on:
                postgres:
                  condition: service_healthy
                redis:
                  condition: service_started
              command: celery -A glitchtip worker -B -l INFO --concurrency 2
              environment:
                DATABASE_URL: postgres://glitchtip:{{ glitchtip_postgres_password }}@postgres:5432/glitchtip
                REDIS_URL: redis://redis:6379/0
                SECRET_KEY: {{ glitchtip_secret_key }}
                GLITCHTIP_DOMAIN: https://glitchtip.maybelle.cryptograss.live
                GLITCHTIP_MAX_EVENT_LIFE_DAYS: "14"
              networks:
                - glitchtip-net
              restart: unless-stopped

            migrate:
              image: glitchtip/glitchtip:latest
              depends_on:
                postgres:
                  condition: service_healthy
              command: ./manage.py migrate
              restart: "no"
              environment:
                DATABASE_URL: postgres://glitchtip:{{ glitchtip_postgres_password }}@postgres:5432/glitchtip
                SECRET_KEY: {{ glitchtip_secret_key }}
              networks:
                - glitchtip-net

          networks:
            glitchtip-net:
              external: true
              name: glitchtip-net

    - name: Start GlitchTip services
      community.docker.docker_compose_v2:
        project_src: /mnt/persist/glitchtip
        state: present
        recreate: "{{ 'always' if (rebuild_images | default(false) | bool) else 'auto' }}"
      register: glitchtip_compose

    - name: Wait for GlitchTip to be ready
      uri:
        url: http://127.0.0.1:8800/
        status_code: [200, 302]
      register: glitchtip_health
      until: glitchtip_health.status in [200, 302]
      retries: 30
      delay: 2

    # Bootstrap GlitchTip with superuser, organization, and project
    - name: Create GlitchTip superuser (idempotent)
      command: docker exec glitchtip-web ./manage.py shell -c "from django.contrib.auth import get_user_model; User = get_user_model(); email = '{{ glitchtip_admin_email }}'; exists = User.objects.filter(email=email).exists(); print('EXISTS' if exists else 'CREATED'); exists or User.objects.create_superuser(email=email, password='{{ glitchtip_admin_password }}')"
      register: glitchtip_superuser
      changed_when: "'CREATED' in glitchtip_superuser.stdout"

    - name: Create GlitchTip organization and PickiPedia project
      command: docker exec glitchtip-web ./manage.py shell -c "from apps.organizations_ext.models import Organization, OrganizationUser; from apps.projects.models import Project; from django.contrib.auth import get_user_model; User = get_user_model(); user = User.objects.get(email='{{ glitchtip_admin_email }}'); org, org_created = Organization.objects.get_or_create(name='Cryptograss', defaults=dict(slug='cryptograss')); OrganizationUser.objects.get_or_create(user=user, organization=org, defaults=dict(role=0)); proj, proj_created = Project.objects.get_or_create(organization=org, name='PickiPedia', defaults=dict(slug='pickipedia', platform='php')); print('ORG_CREATED' if org_created else 'ORG_EXISTS'); print('PROJ_CREATED' if proj_created else 'PROJ_EXISTS')"
      register: glitchtip_project
      changed_when: "'CREATED' in glitchtip_project.stdout"

    - name: Get or create PickiPedia project DSN
      command: docker exec glitchtip-web ./manage.py shell -c "from apps.organizations_ext.models import Organization; from apps.projects.models import Project, ProjectKey; org = Organization.objects.get(slug='cryptograss'); proj = Project.objects.get(organization=org, slug='pickipedia'); key = ProjectKey.objects.filter(project=proj).first() or ProjectKey.objects.create(project=proj); print(key.get_dsn())"
      register: glitchtip_dsn
      changed_when: false

    - name: Save GlitchTip DSN to file
      copy:
        content: "{{ glitchtip_dsn.stdout_lines[-1] }}"
        dest: /mnt/persist/glitchtip/pickipedia-dsn.txt
        mode: '0644'

    - name: Create PickiPedia secrets directory for Jenkins
      file:
        path: /var/jenkins_home/secrets/pickipedia
        state: directory
        mode: '0700'
        owner: '1000'
        group: '1000'

    - name: Write PickiPedia LocalSettings.local.php for Jenkins builds
      copy:
        dest: /var/jenkins_home/secrets/pickipedia/LocalSettings.local.php
        mode: '0600'
        owner: '1000'
        group: '1000'
        content: |
          <?php
          # PickiPedia secrets - managed by ansible

          # Database
          $wgDBtype = "mysql";
          $wgDBserver = "localhost";
          $wgDBname = '{{ pickipedia_db_name | replace('\\', '\\\\') | replace("'", "\\'") }}';
          $wgDBuser = '{{ pickipedia_db_user | replace('\\', '\\\\') | replace("'", "\\'") }}';
          $wgDBpassword = '{{ pickipedia_db_password | replace('\\', '\\\\') | replace("'", "\\'") }}';

          # Security keys
          $wgSecretKey = '{{ pickipedia_secret_key | replace('\\', '\\\\') | replace("'", "\\'") }}';
          $wgUpgradeKey = '{{ pickipedia_upgrade_key | replace('\\', '\\\\') | replace("'", "\\'") }}';
          {% if pickipedia_oauth_secret_key is defined %}
          # OAuth consumer secrets are stored as HMACs keyed with this (Extension:OAuth,
          # Utils::hmacDBSecret). Unset, they're keyed with $wgSecretKey, so rotating that
          # broke every OAuth consumer at once (10 Oct 2026: a 401 on every magenta sign-in
          # and "→ PickiPedia"). Its own vault value, not rotated along with $wgSecretKey.
          $wgOAuthSecretKey = '{{ pickipedia_oauth_secret_key | replace('\\', '\\\\') | replace("'", "\\'") }}';
          {% endif %}

          # Sentry/GlitchTip error tracking
          $wgSentryDsn = '{{ glitchtip_dsn.stdout_lines[-1] | replace('\\', '\\\\') | replace("'", "\\'") }}';

          # Delivery-kid pinning service API key
          $wgDeliveryKidApiKey = '{{ delivery_kid_api_key | replace('\\', '\\\\') | replace("'", "\\'") }}';
          {% if memory_lane_wiki_hook_secret is defined %}
          # Each save, move and upload is pushed to magenta's /api/wiki/hook/, signed with this
          # (extensions/PickiPediaContent/src/MagentaPush.php); the same value is memory-lane's
          # WIKI_HOOK_SECRET above. Unset: no push; magenta's minute sweep alone serves.
          $wgPickiPediaContentMagentaHookSecret = '{{ memory_lane_wiki_hook_secret | replace('\\', '\\\\') | replace("'", "\\'") }}';
          {% endif %}

    # IPFS/Pinning service removed - now handled by delivery-kid

  handlers:
    # A plain restart of the container that's there. Not docker_container with only a name: on 11 Nov 01:14Z
    # this handler, so written, left a container named jenkins with none of its definition (no jenkins_home,
    # no /srv/git, no port): "Start Jenkins container" had reported ok, and Jenkins answered 502. The one
    # place that says what the container is stays "Start Jenkins container".
    - name: Restart Jenkins container
      command: docker restart jenkins

  # Handlers are now in roles (caddy role has its own handlers)


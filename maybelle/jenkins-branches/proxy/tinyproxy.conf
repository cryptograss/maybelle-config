Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 50
LogLevel Notice
# Only the hosts in `allowed`, matched whole; everything else refused, IP addresses included.
Filter "/etc/tinyproxy/allowed"
FilterType ere
FilterDefaultDeny Yes
FilterURLs Off
FilterCaseSensitive Off
ConnectPort 443
ViaProxyName "branches-proxy"
DisableViaHeader Yes

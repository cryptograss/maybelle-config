jenkins:
  systemMessage: "Cryptograss Project Builder"
  numExecutors: 3
  scmCheckoutRetryCount: 2
  mode: NORMAL
  # The branches agent (Plan, section 11): where branch code runs. EXCLUSIVE, so only a job that names it
  # runs there (branch-tests); nothing trusted, which might carry a credential, ever lands on it. It dials in
  # over websocket from its own container on branches-net (maybelle.yml, "The branches agent").
  nodes:
    - permanent:
        name: "branches"
        labelString: "branches"
        mode: EXCLUSIVE
        # One at a time: run-ci kills every builder process after a build, which would kill a second one's.
        numExecutors: 1
        remoteFS: "/home/jenkins/agent"
        launcher:
          inbound:
            webSocket: true
  
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: ${JENKINS_ADMIN_PASSWORD}
        - id: reporter
          password: ${JENKINS_REPORTER_PASSWORD}

  authorizationStrategy:
    globalMatrix:
      entries:
      - userOrGroup:
          name: "admin"
          permissions:
          - "Overall/Administer"
      - user:
          name: "reporter"
          permissions:
          - "Job/Build"
          - "Job/Read"
          - "Overall/Read"
      - user:
          name: "anonymous"
          permissions:
          - "Job/Read"
          - "Overall/Read"

  globalNodeProperties:
    - envVars:
        env:
          - key: "NVM_DIR"
            value: "/var/jenkins_home/.nvm"
          - key: "NODE_VERSION"
            value: "23.6.1"
          - key: "SECRETS_DIR"
            value: "/var/jenkins_home/secrets"

jobs:
  - file: /var/jenkins_home/jobs/arthel-production-build.groovy
  - file: /var/jenkins_home/jobs/arthel-branches-builds.groovy
  - file: /var/jenkins_home/jobs/arthel-fetch-chain-data.groovy
  - file: /var/jenkins_home/jobs/cron-health.groovy
  - file: /var/jenkins_home/jobs/deploy-hunter.groovy
  - file: /var/jenkins_home/jobs/pickipedia-build.groovy
  - file: /var/jenkins_home/jobs/pickipedia-uptime.groovy
  - file: /var/jenkins_home/jobs/pickipedia-import-bluerailroad.groovy
  - file: /var/jenkins_home/jobs/arthel-fetch-pinata-data.groovy
  - file: /var/jenkins_home/jobs/magenta-memory-uptime.groovy
  - file: /var/jenkins_home/jobs/branch-tests.groovy

credentials:
  system:
    domainCredentials:
      - credentials:
        - usernamePassword:
            scope: GLOBAL
            id: "github-token"
            username: "maybelle"
            password: "${GITHUB_TOKEN}"
            description: "GitHub Token"

unclassified:
  location:
    adminAddress: "admin@cryptograss.live"
    url: "https://maybelle.cryptograss.live/"
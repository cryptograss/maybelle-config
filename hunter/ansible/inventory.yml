all:
  hosts:
    hunter:  # After Robert Hunter
      ansible_host: hunter.cryptograss.live
      ansible_user: root
      # ansible_ssh_private_key_file: ~/.ssh/id_ed25519
  vars:
    # Shared PostgreSQL configuration
    postgres_password: "{{ memory_lane_postgres_password }}"
    postgres_db: magenta_memory

    # Base directory for all instances
    base_dir: /opt/magenta
    # memory-lane: part of magenta since 18 Oct 2026, in hunter's clone of it (build-image)
    memory_lane_dir: /opt/magenta/magenta-source/memory-lane

    # Domain for subdomains
    base_domain: hunter.cryptograss.live

    # The people: who each is, and the SSH key hunter knows them by. Apart
    # from containers, so that retiring a container never takes its owner's
    # key with it. Read by: magenta's allowed_signers and wiki names
    # (maybelle.yml), recovery@hunter (every person with a key may open it:
    # Justin, magent-self, 2026-10-23), the router (to a person's own
    # container, while there are any), and the Mood containers (`people:` in
    # an entry below names who may come in).
    people:
      - name: justin
        full_name: "Justin Holmes"
        email: "justin@justinholmes.com"
        github_username: "jMyles"
        pickipedia: "JMyles"  # the name shown in magenta, linked to their wiki user page
        ssh_pubkey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINKHaQ2Nt6I/ADwE+ybNAyBUDG4APLTgu0oQ0V5Jsa0E jmyles@lukowala"  # Replace with: cat ~/.ssh/id_ed25519.pub

      - name: rj
        full_name: "R.J. Partington III"
        email: "rj@example.com"
        github_username: "rjpartingtoniii"
        pickipedia: "RJPARTINGTONIII"
        ssh_pubkey: "ssh-rsa  rjpartingtoniii@Richards-MacBook-Pro-2.local"

      - name: skyler
        full_name: "Skyler Golden"
        email: "skygoldenmusic1@gmail.com"
        github_username: "AudioSkyWalker"
        pickipedia: "SkymanJenkins"
        ssh_pubkey: "ssh-rsa  skylergoldenmusic@Skylers-MBP.home"

      - name: fibonacci
        full_name: "Fibonacci Emery Holmes"
        email: "fibonacci@justinholmes.com"
        github_username: "fibonacci-frames"
        pickipedia: "Fibonacci"
        ssh_pubkey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILtUlbeGAoMsK5/ZhM+L2U77dVSwa8Ip2koo2/lbk5xU fibonacci@fibonacci-Zenbook-15-UM3504DA-UM3504DA"

    # Containers taken out of the inventory: stopped and removed before the
    # others are made (playbook.yml), their files kept on hunter's disk. The
    # shared agency went when each agent got its own container: re's and
    # blu's homes moved from it to theirs (home_from). agency-re and
    # agency-blu went when those were renamed emergent-<name> (Justin,
    # emergence, 31 Oct 2026): the homes move again, whole.
    # delivery-kid went when its container took its Mood's name, uploads-and-embeds
    # (renamed_from, below).
    # uploads-and-embeds (delivery-kid before 1 Nov) and docs-tests-qa went when
    # Moods became directories (Cryptograss:Moods as Directories, step 5): their
    # workspaces folded into /opt/magenta/moods/<slug> (`folds`, below).
    retired: [agency, agency-re, agency-blu, delivery-kid, uploads-and-embeds, docs-tests-qa]

    # A retired Mood container's workspace, moved whole into its Mood's directory
    # the first time (hunter/scripts/fold_mood_homes.py): from the first of `from`
    # that has one, a container that went by more than one name.
    folds:
      - mood: uploads-and-embeds
        from: [uploads-and-embeds, delivery-kid]
      - mood: docs-tests-qa
        from: [docs-tests-qa]

    # Containers (the user-instance role, one each). A person's own container
    # takes its git identity and key from that person's entry above.
    users:
      - name: justin  # justin's own container, the older shape (people, above)
        ssh_port: 2222
        port_range_start: 14000  # 14000-14009
        code_server_password: "{{ code_server_password }}"
        github_token: "{{ magent_github_token }}"
        # magent's poller moved to emergent-magent (Moods as Directories, step 6):
        # this container is Justin's terminal and previews until it retires.
        mood_poller: false

      - name: rj  # rj's own container, the older shape (people, above)
        ssh_port: 2223
        port_range_start: 14010
        code_server_password: "{{ code_server_password }}"
        github_token: "{{ magent_github_token }}"

      - name: skyler  # skyler's own container, the older shape (people, above)
        ssh_port: 2224
        port_range_start: 14020
        code_server_password: "{{ code_server_password }}"
        github_token: "{{ magent_github_token }}"

      - name: fibonacci  # fibonacci's own container, the older shape (people, above)
        ssh_port: 2225
        port_range_start: 14030
        code_server_password: "{{ code_server_password }}"
        github_token: "{{ magent_github_token }}"

      # workbench: the people's box (Cryptograss:Moods as Directories, Justin,
      # emergence, 1 Nov 2026). Every Mood's directory is in it, at /moods,
      # as in every agent's container: people work there beside the agents.
      # A terminal, code-server and the previews; no poller, and no
      # docker.sock (a Mood-kind entry). Reached through the router:
      # `ssh sshrouter@hunter chartifacts` is a shell in /moods/chartifacts,
      # `ssh sshrouter@hunter workbench` one in its home; or on its own port.
      - name: workbench
        mood: workbench
        people: [justin, skyler, rj, fibonacci]
        full_name: "magent-cryptograss"
        email: "magent@cryptograss.live"
        github_username: "magent-cryptograss"
        ssh_port: 2240
        port_range_start: 14100  # 14100-14109: workbench0-9.hunter, until previews go by Mood (step 4)
        code_server_password: "{{ code_server_password }}"
        github_token: "{{ magent_github_token }}"
        mood_poller: false

      # emergent-<name>: each agent's own container (magent-self, 23-24 Oct 2026:
      # Justin, re, magent; first called agency-<name>). It holds the agent's
      # home, its poller and its rules bundle, and nothing else: kind: agent,
      # so no published ports, no
      # code-server, no previews; its own memory and CPU limit, so one agent
      # can't starve another and a bad start takes down one agent, not all.
      # A Mood-kind entry (`mood: emergent`) for what that brings: no
      # docker.sock, full tools only for `people`. No Mood called emergent need
      # exist. The agent's home is kept on hunter's disk at
      # /opt/magenta/emergent-<name>/agents/<name> (hunter/CONTAINERS.md). Its
      # keys are <agent>_runner_key and <agent>_pickipedia_bot_password; the
      # model vendors' are shared by all of them (model_<vendor>_api_key). Its
      # poller doesn't start until its runner key is there.
      # emergent-magent: magent's own container, as re and blu have theirs
      # (Moods as Directories, step 6). Its home is the one magent has always had,
      # justin-arthel's, mounted where it is (home_dir): 11G of sessions and clones,
      # not copied, so every session resumes. justin-arthel writes the home's files
      # (git identity, CLAUDE.md) until it retires, and the home moves here then.
      # No `mood:`: magent answers every Mood, and keeps docker.sock (Justin, 1 Nov
      # 05:24Z). No ports; reached with `ssh sshrouter@hunter emergent-magent`.
      - name: emergent-magent
        kind: agent
        home_dir: /opt/magenta/justin/home
        full_name: "magent-cryptograss"
        email: "magent@cryptograss.live"
        github_username: "magent-cryptograss"
        code_server_password: "{{ code_server_password }}"
        github_token: "{{ magent_github_token }}"
        memory_limit: 8g
        cpus: 3
        mood_poller: true  # wake a turn on web-posted @magent mentions
        # magent's instructions from PickiPedia as each turn's system prompt (--instructions):
        # its greeting line, General Orders, Cryptograss:Agents/Magent/Instructions, the Mood's.
        magent_instructions: true
        # magent's second harness: a Mood whose model is another vendor's runs magent
        # on Pi (magenta#71). Its scaffolding goes once that trial is settled.
        magent_also_harness: pi
        # Its only poller: a session not on this disk is lost, and a mention there
        # starts over from the record.
        magent_only_poller: true

      - name: emergent-re
        mood: emergent
        kind: agent
        people: [justin, skyler]
        full_name: "magent-cryptograss"
        email: "magent@cryptograss.live"
        github_username: "magent-cryptograss"
        code_server_password: "{{ code_server_password }}"
        github_token: "{{ magent_github_token }}"
        mood_poller: false
        memory_limit: 3g
        cpus: 1.5
        agents:
          - name: re
            uid: 2001  # its unix user, in the container and on hunter's disk (its home is kept there)
            # pi, or claude-code; both are set up either way. Anthropic's models run
            # on the subscription (claude_code_oauth_token in the vault, from
            # `claude setup-token`), which Anthropic accepts only from Claude Code:
            # through Pi it answers 400 ("Third-party apps now draw from your extra
            # usage"). Other vendors' run on their API keys below.
            harness: pi
            # A second harness, chosen per Mood by its model (magenta#71): an
            # Anthropic model runs on Claude Code, another vendor's on Pi, so the
            # Mood's model menu moves re between them, and back.
            also_harness: claude-code
            # Its model wherever a Mood's menu doesn't choose one, as Pi names it.
            # Not the vault's re_model (anthropic/claude-sonnet-5-5): through Pi
            # that goes to the subscription, which answers 400 ("Third-party apps
            # now draw from your extra usage"), so re failed in every Mood but
            # docs-tests-qa, the one whose menu chose this.
            model: openrouter/deepseek/deepseek-v4-pro
            # Vendor: the variable Pi reads its key from. The key itself is
            # model_<vendor>_api_key in the vault, one for every agent (or
            # re_<vendor>_api_key, to give re its own); a vendor without one
            # is greyed out in the Mood's model menu.
            model_keys:
              openrouter: OPENROUTER_API_KEY
              anthropic: ANTHROPIC_API_KEY
              openai: OPENAI_API_KEY
              google: GEMINI_API_KEY
              moonshotai: MOONSHOT_API_KEY
              deepseek: DEEPSEEK_API_KEY
            wiki_user: "Re@re"                                 # its PickiPedia bot password's login name
            letter: workspace/red/LETTER.md
            # What re is told lives in one place: its instructions from PickiPedia,
            # each turn (--instructions): its greeting line, General Orders,
            # Cryptograss:Agents/Re/Instructions, the Mood's. Its old rules file
            # (red/RULES.md, a rules: entry here) is gone, and the links to it with it.
            instructions: true
            repos: [magent-cryptograss/red, cryptograss/magenta, cryptograss/maybelle-config,
                    cryptograss/pickipedia, cryptograss/arthel]
      - name: emergent-blu
        mood: emergent
        kind: agent
        people: [justin, skyler]
        full_name: "magent-cryptograss"
        email: "magent@cryptograss.live"
        github_username: "magent-cryptograss"
        code_server_password: "{{ code_server_password }}"
        github_token: "{{ magent_github_token }}"
        mood_poller: false
        memory_limit: 3g
        cpus: 1.5
        agents:
          - name: blu
            uid: 2002  # never reused: its home is kept on hunter's disk under this number
            # The blue agent, for the connectome (Justin, magent-self, 2026-10-19).
            # Set up like re: Pi for other vendors' models, Claude Code for
            # Anthropic's (magenta#71).
            harness: pi
            also_harness: claude-code
            model: openrouter/deepseek/deepseek-v4-pro
            model_keys:
              openrouter: OPENROUTER_API_KEY
              anthropic: ANTHROPIC_API_KEY
              openai: OPENAI_API_KEY
              google: GEMINI_API_KEY
              moonshotai: MOONSHOT_API_KEY
              deepseek: DEEPSEEK_API_KEY
            wiki_user: "Blu@blu"                               # its PickiPedia bot password's login name
            # No rules: or letter: file. blu's instructions live only on PickiPedia
            # (Cryptograss:Agents/GeneralOrders and Cryptograss:Agents/Blu/Instructions)
            # and reach it through its poller (magenta memory-lane/poller/instructions.py):
            # instructions gives its poller --instructions, so each turn is given them
            # as system prompt. Only a revision by a trusted editor (JMyles,
            # SkymanJenkins) counts; until each page has one, the recovery
            # instructions stand in and blu says so.
            instructions: true
            repos: [cryptograss/pickipedia, cryptograss/rabbithole, cryptograss/magenta]

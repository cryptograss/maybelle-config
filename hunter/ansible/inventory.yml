all:
  hosts:
    hunter:  # After Robert Hunter
      ansible_host: hunter.cryptograss.live
      ansible_user: root
      # ansible_ssh_private_key_file: ~/.ssh/id_ed25519
  vars:
    # Shared PostgreSQL configuration
    postgres_password: "{{ memory_lane_postgres_password }}"
    postgres_db: magenta_memory

    # Base directory for all instances
    base_dir: /opt/magenta

    # Domain for subdomains
    base_domain: hunter.cryptograss.live

    # Set true for exactly one deploy to make the watcher re-ingest every
    # existing JSONL line (recovers lines an older watcher dropped; see
    # jMyles/memory-lane#15). Idempotent. Set back to false afterwards.
    watcher_replay_from_start: false

    # User instances configuration
    users:
      - name: justin
        full_name: "Justin Holmes"
        email: "justin@justinholmes.com"
        github_username: "jMyles"
        ssh_pubkey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINKHaQ2Nt6I/ADwE+ybNAyBUDG4APLTgu0oQ0V5Jsa0E jmyles@lukowala"  # Replace with: cat ~/.ssh/id_ed25519.pub
        ssh_port: 2222
        port_range_start: 14000  # 14000-14009
        code_server_password: "{{ code_server_password }}"
        github_token: "{{ magent_github_token }}"
        motion_poller: true  # wake a turn on web-posted @magent mentions

      - name: rj
        full_name: "R.J. Partington III"
        email: "rj@example.com"
        github_username: "rjpartingtoniii"
        ssh_pubkey: "ssh-rsa  rjpartingtoniii@Richards-MacBook-Pro-2.local"
        ssh_port: 2223
        port_range_start: 14010
        code_server_password: "{{ code_server_password }}"
        github_token: "{{ magent_github_token }}"

      - name: skyler
        full_name: "Skyler Golden"
        email: "skygoldenmusic1@gmail.com"
        github_username: "AudioSkyWalker"
        ssh_pubkey: "ssh-rsa  skylergoldenmusic@Skylers-MBP.home"
        ssh_port: 2224
        port_range_start: 14020
        code_server_password: "{{ code_server_password }}"
        github_token: "{{ magent_github_token }}"

      - name: fibonacci
        full_name: "Fibonacci Emery Holmes"
        email: "fibonacci@justinholmes.com"
        github_username: "fibonacci-frames"
        ssh_pubkey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILtUlbeGAoMsK5/ZhM+L2U77dVSwa8Ip2koo2/lbk5xU fibonacci@fibonacci-Zenbook-15-UM3504DA-UM3504DA"
        ssh_port: 2225
        port_range_start: 14030
        code_server_password: "{{ code_server_password }}"
        github_token: "{{ magent_github_token }}"

      # --- Moods (memory-lane Motions) with a container of their own -------
      # (memory-lane #52.) An entry with `motion:` is a Mood's container, not a
      # person's: no docker.sock, so full tools can open up to the `people`
      # in it; a poller that answers that Mood (its sessions live only here);
      # git as magent. Reached by SSH on its own port with any of the people's
      # keys (`ssh -p <ssh_port> magent@hunter.cryptograss.live`), not through
      # the router, which routes each key to its owner's container. Its web
      # ports work as anyone's: <name>1.hunter.cryptograss.live and so on.
      - name: delivery-kid
        motion: delivery-kid
        people: [justin, skyler]
        full_name: "magent-cryptograss"
        email: "magent@cryptograss.live"
        github_username: "magent-cryptograss"
        ssh_port: 2230
        port_range_start: 14040  # 14040-14049
        code_server_password: "{{ code_server_password }}"
        github_token: "{{ magent_github_token }}"
        motion_poller: true
        # Brought over once, before the container first starts: Sky's
        # delivery-kid session and the checkout it works in, at the same
        # paths, so a wake here can resume it. Skipped once it's here.
        import_session:
          from: skyler
          id: b44becf4-487a-4e9f-bf3a-a881c7420e01
          project: -home-magent-workspace-maybelle-config--claude-worktrees-preview-and-progress-fixes
          workspace: maybelle-config

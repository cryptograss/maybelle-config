---
- name: Create user directory
  file:
    path: "{{ base_dir }}/{{ user.name }}"
    state: directory
    mode: '0755'

- name: Create home directory volume for user
  file:
    path: "{{ base_dir }}/{{ user.name }}/home"
    state: directory
    owner: 1000  # magent user ID in container
    group: 1000
    mode: '0755'

- name: Create workspace directory for user
  file:
    path: "{{ base_dir }}/{{ user.name }}/home/workspace"
    state: directory
    owner: 1000  # magent user ID in container
    group: 1000
    mode: '0755'

- name: Create .claude directory for user (in persistent home directory)
  file:
    path: "{{ base_dir }}/{{ user.name }}/home/.claude"
    state: directory
    owner: 1000  # magent user ID in container
    group: 1000
    mode: '0755'

- name: Create .ssh directory for user
  file:
    path: "{{ base_dir }}/{{ user.name }}/.ssh"
    state: directory
    owner: 1000  # magent user ID in container
    group: 1000
    mode: '0700'

- name: Copy shared CLAUDE.md to user .claude directory
  copy:
    src: "/opt/magenta/magenta-source/CLAUDE.md"
    dest: "{{ base_dir }}/{{ user.name }}/home/.claude/CLAUDE.md"
    owner: 1000
    group: 1000
    remote_src: yes

- name: Create Claude Code local settings
  copy:
    dest: "{{ base_dir }}/{{ user.name }}/home/.claude/settings.local.json"
    owner: 1000
    group: 1000
    mode: '0644'
    content: |
      {
        "includeCoAuthoredBy": false,
        "permissions": {
          "allow": [
            "Read(*)",
            "Bash(git:*)",
            "Bash(ls:*)",
            "Bash(cat:*)",
            "Bash(head:*)",
            "Bash(tail:*)",
            "Bash(wc:*)",
            "Bash(netstat:*)",
            "Bash(ss:*)",
            "Bash(ps:*)",
            "Bash(hostname:*)",
            "Bash(which:*)",
            "Bash(find:*)",
            "Bash(grep:*)",
            "Bash(docker:*)",
            "Bash(docker-compose:*)",
            "mcp__magenta-memory-v2",
            "mcp__pickipedia"
          ]
        }
      }

- name: Create user context file
  copy:
    dest: "{{ base_dir }}/{{ user.name }}/home/.claude/USER_CONTEXT.md"
    owner: 1000
    group: 1000
    content: |
      # {{ user.full_name }}

      Name: {{ user.full_name }}
      Username: {{ user.name }}
      Email: {{ user.email }}
      GitHub: {{ user.github_username }}

      Port range: {{ user.port_range_start }}-{{ user.port_range_start + 9 }}
      Subdomains: {{ user.name }}1.{{ base_domain }} through {{ user.name }}10.{{ base_domain }}

# A Mood's container lets in the people in it, by their keys.
- name: Write user SSH public key to authorized_keys
  copy:
    dest: "{{ base_dir }}/{{ user.name }}/.ssh/authorized_keys"
    content: |
      {% if user.motion is defined %}
      {% for person in users if person.name in (user.people | default([])) and person.ssh_pubkey is defined %}
      {{ person.ssh_pubkey }}
      {% endfor %}
      {% else %}
      {{ user.ssh_pubkey }}
      {% endif %}
    owner: 1000  # magent user ID in container
    group: 1000
    mode: '0600'

- name: Create git config for user (in persistent home directory)
  copy:
    dest: "{{ base_dir }}/{{ user.name }}/home/.gitconfig"
    owner: 1000
    group: 1000
    mode: '0644'
    content: |
      [user]
        name = {{ user.full_name }}
        email = {{ user.email }}
      [github]
        user = {{ user.github_username }}

# Bringing a session into a Mood's container, once, before it first starts:
# the session's transcript (and its helpers' folder, if any) and the checkout
# it works in, at the same paths, so a wake here resumes it with --resume.
# Copied, not moved: the person's own container keeps theirs. Anything
# already there is left alone, so what the Mood has since written stays.
- name: Bring a session into a Mood's container
  when: user.import_session is defined
  shell: |
    set -e
    src="{{ base_dir }}/{{ user.import_session.from }}/home"
    dst="{{ base_dir }}/{{ user.name }}/home"
    project=".claude/projects/{{ user.import_session.project }}"
    test -f "$src/$project/{{ user.import_session.id }}.jsonl"
    mkdir -p "$dst/$project" "$dst/workspace"
    if [ ! -e "$dst/$project/{{ user.import_session.id }}.jsonl" ]; then
      cp -a "$src/$project/{{ user.import_session.id }}.jsonl" "$dst/$project/"
    fi
    if [ -d "$src/$project/{{ user.import_session.id }}" ] && [ ! -e "$dst/$project/{{ user.import_session.id }}" ]; then
      cp -a "$src/$project/{{ user.import_session.id }}" "$dst/$project/"
    fi
    if [ ! -e "$dst/workspace/{{ user.import_session.workspace }}" ]; then
      cp -a "$src/workspace/{{ user.import_session.workspace }}" "$dst/workspace/{{ user.import_session.workspace }}"
    fi
    chown -R 1000:1000 "$dst/.claude" "$dst/workspace/{{ user.import_session.workspace }}"
  args:
    executable: /bin/bash

- name: Create user-specific docker-compose file
  template:
    src: docker-compose.yml.j2
    dest: "{{ base_dir }}/{{ user.name }}/docker-compose.yml"

- name: Start user instance (recreate to pick up new image)
  command: docker compose up -d --force-recreate
  args:
    chdir: "{{ base_dir }}/{{ user.name }}"

- name: Wait for container to initialize (give startup script time to run)
  pause:
    seconds: 5

- name: Deploy .env file from vault for arthel builds
  when: user.motion is not defined  # a Mood's container has no arthel checkout
  copy:
    content: |
      ALCHEMY_API_KEY={{ ALCHEMY_API_KEY }}
      INFURA_API_KEY={{ INFURA_API_KEY }}
      DISCORD_BOT_TOKEN={{ DISCORD_BOT_TOKEN }}
      PINATA_JWT={{ pinata_jwt }}
    dest: "{{ base_dir }}/{{ user.name }}/home/workspace/arthel/.env"
    owner: 1000
    group: 1000
    mode: '0600'

- name: Show container startup logs
  shell: docker logs {{ user.name }}-arthel
  register: container_logs
  ignore_errors: yes

- name: Display container startup logs
  debug:
    msg: "{{ container_logs.stdout_lines }}"
  when: container_logs is defined and container_logs.stdout_lines is defined

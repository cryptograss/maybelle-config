---
# recovery@hunter: `magenta.sh recovery` (cryptograss/magenta). Claude Code --
# magent -- on hunter's host, for when Justin and magent can't reach each other
# at all: the containers are down, Docker is wedged, no Mood answers. Agreed in
# the magent-self Mood, 2026-10-15.
#
# What it can do: read the journal (systemd-journal), use Docker (the docker
# group: root on this host, in effect), and restart dockerd (sudo, for that one
# command), because when dockerd is wedged the docker group can do nothing. Who
# can open it: only the people in `recovery_people` (inventory), by their keys,
# and only into the recovery session. Its rules: files/CLAUDE.md.

- name: The recovery user
  user:
    name: recovery
    shell: /bin/bash
    groups: [docker, systemd-journal]
    append: yes
    create_home: yes
    state: present

- name: Its directories
  file:
    path: "/home/recovery/{{ item.path }}"
    state: directory
    owner: recovery
    group: recovery
    mode: "{{ item.mode }}"
  loop:
    - {path: .ssh, mode: '0700'}
    - {path: .claude, mode: '0700'}
    - {path: .config, mode: '0700'}
    - {path: .config/magenta, mode: '0700'}
    - {path: notes, mode: '0750'}
    - {path: .cache, mode: '0700'}
    - {path: .local, mode: '0755'}

- name: Whose keys open it, and only into the recovery session
  template:
    src: authorized_keys.j2
    dest: /home/recovery/.ssh/authorized_keys
    owner: recovery
    group: recovery
    mode: '0600'

- name: The recovery session (the login's forced command)
  copy:
    src: magenta-recovery
    dest: /usr/local/bin/magenta-recovery
    owner: root
    group: root
    mode: '0755'

- name: Its rules and permissions
  copy:
    src: "{{ item.src }}"
    dest: "/home/recovery/.claude/{{ item.dest }}"
    owner: recovery
    group: recovery
    mode: '0600'
  loop:
    - {src: CLAUDE.md, dest: CLAUDE.md}
    - {src: settings.json, dest: settings.json}

# Claude Code keeps its own state here; seeded once so the first start
# doesn't walk Justin through onboarding mid-emergency.
- name: Its Claude Code state, the first time
  copy:
    dest: /home/recovery/.claude.json
    content: '{"hasCompletedOnboarding": true}'
    owner: recovery
    group: recovery
    mode: '0600'
    force: no

# The record, over the private network: the same server the containers use.
- name: Its memory (the MCP server on maybelle)
  copy:
    dest: /home/recovery/.config/magenta/mcp.json
    owner: recovery
    group: recovery
    mode: '0600'
    content: |
      {
        "mcpServers": {
          "magenta-memory-v2": {"type": "http", "url": "http://10.0.0.2:8000"}
        }
      }

# Two ways in, each its own session (files/magenta-recovery), that share
# nothing but hunter and its network, in case part of the trouble is one of
# them (Justin, 2026-10-16): Pi on OpenRouter, and Claude Code on the
# subscription. Whichever of Claude Code, Pi, the subscription or OpenRouter
# breaks, the other route still works.
#
# OpenRouter, Pi's: recovery_openrouter_api_key in the vault, for a key and a
# credit limit of its own, or else the agents' model_openrouter_api_key.
- name: Its OpenRouter key
  vars:
    openrouter_key: "{{ recovery_openrouter_api_key | default(model_openrouter_api_key | default('')) }}"
  when: openrouter_key | length > 0
  copy:
    dest: /home/recovery/.config/magenta/openrouter_key
    content: "{{ openrouter_key }}"
    owner: recovery
    group: recovery
    mode: '0600'
  no_log: true

# The subscription, Claude Code's: recovery_claude_code_oauth_token, or else
# the agents' claude_code_oauth_token (from `claude setup-token`). Without
# either, that route's Claude Code asks Justin to /login.
- name: Its subscription token
  vars:
    subscription_token: "{{ recovery_claude_code_oauth_token | default(claude_code_oauth_token | default('')) }}"
  when: subscription_token | length > 0
  copy:
    dest: /home/recovery/.config/magenta/claude_token
    content: "{{ subscription_token }}"
    owner: recovery
    group: recovery
    mode: '0600'
  no_log: true

- name: Restarting dockerd, the one thing it does as root
  copy:
    dest: /etc/sudoers.d/magenta-recovery
    content: |
      # recovery@hunter (hunter/ansible/roles/recovery): when dockerd is wedged
      recovery ALL=(root) NOPASSWD: /usr/bin/systemctl restart docker, /usr/bin/systemctl start docker
    owner: root
    group: root
    mode: '0440'
    validate: visudo -cf %s

# Claude Code's own installer, as the user (it checks the binary's checksum
# against Anthropic's manifest). It keeps itself up to date after that.
- name: Fetch Claude Code's installer
  get_url:
    url: https://claude.ai/install.sh
    dest: /home/recovery/.config/magenta/claude-install.sh
    owner: recovery
    group: recovery
    mode: '0700'

- name: Install Claude Code for recovery
  become: yes
  become_user: recovery
  command: bash /home/recovery/.config/magenta/claude-install.sh
  args:
    chdir: /home/recovery
    creates: /home/recovery/.local/bin/claude

# Pi needs Node 22.19 or later; Ubuntu 24.04 has 18. Node's own build, for
# recovery alone (nothing system-wide changes), checked against the sha256
# nodejs.org publishes for it (SHASUMS256.txt), pinned here.
- name: Fetch Node for Pi
  get_url:
    url: "https://nodejs.org/dist/{{ recovery_node_version }}/node-{{ recovery_node_version }}-linux-x64.tar.xz"
    dest: "/home/recovery/.cache/node-{{ recovery_node_version }}-linux-x64.tar.xz"
    checksum: "sha256:{{ recovery_node_sha256 }}"
    owner: recovery
    group: recovery
    mode: '0644'

- name: Unpack Node for Pi
  unarchive:
    src: "/home/recovery/.cache/node-{{ recovery_node_version }}-linux-x64.tar.xz"
    dest: /home/recovery/.local
    remote_src: yes
    owner: recovery
    group: recovery
    creates: "/home/recovery/.local/node-{{ recovery_node_version }}-linux-x64/bin/node"

- name: Its Node, by a name that outlives the version
  file:
    src: "/home/recovery/.local/node-{{ recovery_node_version }}-linux-x64"
    dest: /home/recovery/.local/node
    state: link
    owner: recovery
    group: recovery

# Pinned, as in the hunter image (Dockerfile): the version re runs on.
- name: Install Pi for recovery
  become: yes
  become_user: recovery
  command: >-
    /home/recovery/.local/node/bin/npm install --global --no-fund --no-audit
    --prefix /home/recovery/.local/pi @earendil-works/pi-coding-agent@{{ recovery_pi_version }}
  environment:
    PATH: "/home/recovery/.local/node/bin:/usr/bin:/bin"
  args:
    chdir: /home/recovery
    creates: "/home/recovery/.local/pi/lib/node_modules/@earendil-works/pi-coding-agent/package.json"

- name: Pi's directories
  file:
    path: "/home/recovery/.pi/agent/{{ item }}"
    state: directory
    owner: recovery
    group: recovery
    mode: '0700'
  loop: ['', extensions]

# Pi asks for nothing by default; this asks Justin before anything that may
# change something, and refuses the never-list outright (files/recovery-gate.ts).
- name: Pi's rules, memory and gate
  copy:
    src: "{{ item.src }}"
    dest: "/home/recovery/.pi/agent/{{ item.dest }}"
    owner: recovery
    group: recovery
    mode: '0600'
  loop:
    - {src: CLAUDE.md, dest: AGENTS.md}
    - {src: recovery-gate.ts, dest: extensions/recovery-gate.ts}

- name: Pi's memory (the MCP server on maybelle)
  copy:
    dest: /home/recovery/.pi/agent/mcp.json
    owner: recovery
    group: recovery
    mode: '0600'
    content: |
      {
        "mcpServers": {
          "magenta-memory-v2": {"url": "http://10.0.0.2:8000", "description": "The record: what was said in the Moods and sessions."}
        }
      }

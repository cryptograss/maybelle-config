---
# All repository fetches run under a common environment so a stalled transfer
# fails loudly instead of hanging forever.
#
# On 2026-09-03 the first task below wedged for nine days. git-remote-https
# created a zero-byte FETCH_HEAD and then blocked: no established socket, no
# CPU, no timeout. The repo was public and returned 200, host DNS resolved
# instantly, and there was no credential helper — so nothing diagnosed it and
# nothing ended it. `any_errors_fatal: true` meant the whole play sat there,
# and because it was silent, nobody noticed hunter was undeployable.
#
# These do not fix the underlying wedge. They make it announce itself:
#   GIT_HTTP_LOW_SPEED_LIMIT/TIME  abort a transfer moving under 1KB/s for 60s
#   GIT_TERMINAL_PROMPT            fail on a credential prompt instead of
#                                  blocking on a stdin that never arrives
#                                  (deploy-hunter-remote.py pipes the vault
#                                  password through `ssh -t`, so a downstream
#                                  read blocks rather than getting EOF)
- name: Fetch source repositories
  environment:
    GIT_HTTP_LOW_SPEED_LIMIT: "1000"
    GIT_HTTP_LOW_SPEED_TIME: "60"
    GIT_TERMINAL_PROMPT: "0"
  block:
    - name: Clone or update maybelle-config repository
      git:
        repo: https://github.com/cryptograss/maybelle-config.git
        dest: "{{ base_dir }}/maybelle-config"
        version: production
        force: yes
        update: yes

    - name: Force fetch latest changes from production branch
      shell: git fetch origin production && git reset --hard origin/production
      args:
        chdir: "{{ base_dir }}/maybelle-config"

    - name: Clone or update memory-lane repository (for watcher)
      git:
        repo: https://github.com/cryptograss/memory-lane.git
        dest: "{{ base_dir }}/memory-lane-source"
        version: main
        force: yes
        update: yes

    - name: Force fetch latest memory-lane changes from main branch
      shell: git fetch origin main && git reset --hard origin/main
      args:
        chdir: "{{ base_dir }}/memory-lane-source"

    - name: Clone or update magenta repository (for shared CLAUDE.md)
      git:
        repo: https://github.com/cryptograss/magenta.git
        dest: "{{ base_dir }}/magenta-source"
        version: main
        force: yes
        update: yes

    - name: Force fetch latest magenta changes from main branch
      shell: git fetch origin main && git reset --hard origin/main
      args:
        chdir: "{{ base_dir }}/magenta-source"

- name: Get docker group GID from host
  shell: "getent group docker | cut -d: -f3"
  register: docker_gid

# The build's own log, step by step, in /opt/magenta/logs: watch it during a
# deploy with `tail -f /opt/magenta/logs/image-build.log` on hunter, and the
# next task says where the time went.
- name: Create the build log directory
  file:
    path: "{{ base_dir }}/logs"
    state: directory
    mode: '0755'

- name: Build magenta-arthel base image (step by step in /opt/magenta/logs/image-build.log)
  shell: >
    set -o pipefail;
    [ -f {{ base_dir }}/logs/image-build.log ] && mv -f {{ base_dir }}/logs/image-build.log {{ base_dir }}/logs/image-build.previous.log;
    docker compose --progress plain -f docker-compose-build.yml build --build-arg DOCKER_GID={{ docker_gid.stdout }}
    > {{ base_dir }}/logs/image-build.log 2>&1
  args:
    chdir: "{{ base_dir }}/maybelle-config/hunter"
    executable: /bin/bash
  register: image_build
  failed_when: false  # the timing below is shown either way; the deploy stops after it if this failed

- name: Where the image build spent its time
  command: python3 {{ base_dir }}/maybelle-config/hunter/scripts/build_timing.py {{ base_dir }}/logs/image-build.log
  register: build_timing
  changed_when: false

- name: Show the build's timing
  debug:
    var: build_timing.stdout_lines

- name: Stop if the image build failed
  shell: tail -n 40 {{ base_dir }}/logs/image-build.log
  register: build_tail
  when: image_build.rc != 0
  changed_when: false
  failed_when: true

- name: Verify image was built
  command: docker images magenta-arthel:latest --format "{% raw %}{{.Repository}}:{{.Tag}}{% endraw %}"
  register: image_check
  failed_when: "'magenta-arthel:latest' not in image_check.stdout"

# Cap BuildKit cache so repeated rebuilds (especially the periodic base-image
# bumps) don't accumulate unbounded. -f only skips the prompt: this removes
# any cache not in use right now, oldest first, until the cap is left.
#
# 20GB, not 3GB (2026-10-16): the image's own cache is about 10GB, and since
# hunter's 2026-10-15 reboot two builds in a row reused nothing at all (0 of
# 35 steps, then 0 of 33, the base image unchanged), each costing about six
# minutes a deploy. A 3GB cap can't hold one build's cache, if that cache is
# reclaimable. The weekly `builder prune -a` (housekeeping) still clears it
# all on Sundays; the disk had 43GB free.
- name: Cap Docker BuildKit cache at 20GB
  command: docker builder prune -f --keep-storage 20GB

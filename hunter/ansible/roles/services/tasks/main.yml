---
# Hunter services: none of its own any more. postgres, MCP and Memory Lane
# moved to maybelle long ago; the watcher went on 1 Nov 2026 (Justin,
# emergence): every turn reaches the record from the pollers' own stream
# (events/1, Claude Code and Pi alike), and the watcher only re-sent the same
# Claude Code lines, by the same uuids, while failing on the newer line types.
# These tasks take the old ones down and leave nothing behind, once.
- name: Stop services that no longer run on hunter
  command: docker rm -f {{ item }}
  loop:
    - mcp-server
    - memory-lane
    - magenta-postgres
    - watcher
  register: stopped
  changed_when: stopped.rc == 0
  failed_when: false

- name: Remove the watcher's compose file and its .env (the ingest key)
  file:
    path: "{{ memory_lane_dir }}/{{ item }}"
    state: absent
  loop:
    - docker-compose.watcher.yml
    - .env

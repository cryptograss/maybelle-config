---
# githouse: our canonical clones of the repositories, at {{ base_dir }}/git,
# mounted read-only at /srv/git in every container (hunter/githouse/githouse.py
# says the rules). One container on magenta-net, reached as githouse:22 by the
# containers' agents and people pushing their own branches, each by a key whose
# public half is its `git_key` in the inventory and whose private half is
# <name>_git_private_key in the vault (put there by a person, never made here).
# With githouse_deploy_key in the vault, GitHub is fetched over ssh and pushes
# go on to it; without, it fetches over https and keeps pushes here.

- name: Where githouse keeps the repositories, and its build
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ base_dir }}/git"
    - "{{ base_dir }}/githouse"
    - "{{ base_dir }}/githouse/etc"

- name: githouse's code (its tests run as it's built)
  copy:
    src: "{{ playbook_dir }}/../githouse/{{ item }}"
    dest: "{{ base_dir }}/githouse/{{ item }}"
    mode: '0644'
  loop: [Dockerfile, githouse.py, test_githouse.py, entrypoint.sh, sshd_config]

# Each key may only run githouse auth, as the one it names: no shell, no forwarding.
- name: Who may push, and as whom
  copy:
    dest: "{{ base_dir }}/githouse/etc/authorized_keys"
    mode: '0644'
    content: |
      {% for user in users %}
      {% for agent in user.agents | default([]) if agent.git_key is defined %}
      command="python3 /opt/githouse/githouse.py auth {{ agent.name }}",restrict {{ agent.git_key }}
      {% endfor %}
      {% endfor %}
      {% for person in people | default([]) if person.git_key is defined %}
      command="python3 /opt/githouse/githouse.py auth {{ person.name }}",restrict {{ person.git_key }}
      {% endfor %}

- name: The deploy key for GitHub, if the vault has one
  copy:
    dest: "{{ base_dir }}/githouse/etc/deploy_key"
    content: "{{ githouse_deploy_key | default('') }}"
    mode: '0600'
  no_log: true

- name: The githouse compose file
  copy:
    dest: "{{ base_dir }}/githouse/docker-compose.yml"
    mode: '0644'
    content: |
      services:
        githouse:
          build: .
          container_name: githouse
          environment:
            - GITHOUSE_REPOS={{ githouse_repos | join(' ') }}
          volumes:
            - {{ base_dir }}/git:/srv/git
            - {{ base_dir }}/githouse/etc:/etc/githouse:ro
          # ssh only over magenta-net (githouse:22), for the containers. branches.json
          # (8091) only to Caddy, which publishes it at git.{{ base_domain }}.
          ports:
            - "127.0.0.1:8091:8091"
          networks: [magenta-net]
          mem_limit: 512m
          cpus: 0.5
          restart: unless-stopped
      networks:
        magenta-net:
          external: true
          name: magenta-net

- name: Start githouse
  command: docker compose up -d --build --force-recreate
  args:
    chdir: "{{ base_dir }}/githouse"

- name: githouse has the repositories (its first fetch can take a while; arthel is big)
  stat:
    path: "{{ base_dir }}/git/branches.json"
  register: githouse_branches
  retries: 30
  delay: 10
  until: githouse_branches.stat.exists

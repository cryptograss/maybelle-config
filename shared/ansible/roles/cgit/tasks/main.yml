# cgit: githouse's repositories to read in a browser, read-only, at code.{{ domain_name }} (Caddy in front).
# Justin, #ramp, 11 Nov: "where can I simply browse the codebases?" ... "cgit with Pygments, go ahead and build it".
# Needs: githouse_dir, githouse_repos, githouse_port (the githouse role's); cgit_port (localhost only);
# cgit_githouse_host (the name its clone URLs give); cgit_deploys_from ({repo: the branch each opens on}).
#
# Each repository is mounted on its own, read-only: githouse's directory also holds its deploy key, its host
# keys and its merge records, and none of that is cgit's to see.

- name: Where cgit's build lives
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /mnt/persist/cgit
    - /mnt/persist/cgit/build

- name: cgit's image (lighttpd, cgit, Pygments, Markdown)
  copy:
    src: "{{ item }}"
    dest: "/mnt/persist/cgit/build/{{ item }}"
    mode: '0644'
  loop: [Dockerfile, lighttpd.conf, robots.txt]

- name: cgit's settings and its repositories
  template:
    src: cgitrc.j2
    dest: /mnt/persist/cgit/build/cgitrc
    mode: '0644'

- name: The cgit compose file
  copy:
    dest: /mnt/persist/cgit/docker-compose.yml
    mode: '0644'
    content: |
      services:
        cgit:
          build: ./build
          container_name: cgit
          volumes:
      {% for full in githouse_repos %}
            - {{ githouse_dir }}/git/{{ full.split('/')[-1] }}.git:/srv/git/{{ full.split('/')[-1] }}.git:ro
      {% endfor %}
          # Read-only but for these: cgit's cache, and where lighttpd spills a long page (a file's view, a big diff).
          tmpfs:
            - /var/cache/cgit:mode=1777
            - /var/tmp:mode=1777
            - /tmp:mode=1777
          ports:
            - "127.0.0.1:{{ cgit_port }}:8080"
          read_only: true
          mem_limit: 256m
          cpus: 0.5
          restart: unless-stopped

- name: Start cgit
  command: docker compose up -d --build --force-recreate
  args:
    chdir: /mnt/persist/cgit

- name: cgit answers, and lists githouse's repositories
  uri:
    url: "http://127.0.0.1:{{ cgit_port }}/"
    return_content: true
  register: cgit_index
  retries: 10
  delay: 2
  until: cgit_index.status == 200
  failed_when: cgit_index.status != 200 or (githouse_repos | map('regex_replace', '^.*/', '') | reject('in', cgit_index.content) | list | length > 0)

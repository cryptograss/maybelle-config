# cgit behind lighttpd, on 8080 inside the container; Caddy on the host is in front (TLS, the name).
server.modules = ("mod_alias", "mod_cgi", "mod_rewrite")
server.document-root = "/usr/share/cgit"
server.port = 8080
server.username = "www-data"
server.groupname = "www-data"
mimetype.assign = (".css" => "text/css", ".png" => "image/png", ".ico" => "image/x-icon", ".txt" => "text/plain")
alias.url = ("/cgit.cgi" => "/usr/lib/cgit/cgit.cgi")
cgi.assign = ("cgit.cgi" => "")
# The stylesheet, the logo and robots.txt are files; everything else is cgit's (virtual-root=/).
url.rewrite-if-not-file = ("^/([^?]*)(?:\?(.*))?$" => "/cgit.cgi?url=$1&$2")

---
# SSH by key only, on every box we run.
#
# A drop-in, not lineinfile on sshd_config: Ubuntu's sshd_config starts
# with "Include /etc/ssh/sshd_config.d/*.conf", sshd keeps the FIRST value
# it reads for each keyword, and a cloud image's 50-cloud-init.conf sets
# "PasswordAuthentication yes". A 00- file is read before it, so it wins.

- name: sshd_config reads its drop-ins first
  command: grep -qE '^Include /etc/ssh/sshd_config.d/\*\.conf' /etc/ssh/sshd_config
  changed_when: false

- name: Keys only, no passwords, root by key alone
  copy:
    dest: /etc/ssh/sshd_config.d/00-keys-only.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # From maybelle-config (shared/ansible/roles/ssh-keys-only). Not by hand.
      PubkeyAuthentication yes
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitEmptyPasswords no
      PermitRootLogin prohibit-password
    validate: /usr/sbin/sshd -t -f %s
  register: keys_only

- name: sshd takes it up
  service:
    name: ssh   # Ubuntu calls it ssh, not sshd
    state: reloaded
  when: keys_only.changed

- name: What sshd actually runs with
  command: /usr/sbin/sshd -T -C user=nobody,host=localhost,addr=127.0.0.1
  register: sshd_effective
  changed_when: false

- name: No password way in
  assert:
    that:
      - "'passwordauthentication no' in sshd_effective.stdout_lines"
      - "'kbdinteractiveauthentication no' in sshd_effective.stdout_lines"
      - "'permitrootlogin without-password' in sshd_effective.stdout_lines or 'permitrootlogin prohibit-password' in sshd_effective.stdout_lines"
    fail_msg: "sshd still lets a password in; something read before 00-keys-only.conf sets it"
